<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pentagram Hesaplama Uygulaması</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/sistem-logosu.png" type="image/png">
<script>
  (function(){
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F3EAE0; --ink-soft:#CFC2E0; --paper:#140A1E; --paper-alt:#1B0F2A;
    --card:#221336; --line:#3A2050; --brand:#6B3FA0; --brand-dark:#E4D4F5;
    --brand-text:#C9A6EA; --brand-soft:rgba(124,79,176,.16);
    --gold:#E4A848; --gold-lt:#F5D89C; --radius:16px;
    --shadow:0 24px 60px -24px rgba(0,0,0,.7); font-size:16px;
    --statik:#7FB2FF; --dinamik:#FF7A7A; --eksik:#9F97BC; --eksen:#E4A848; --seviye:#4CC98A;
    --yildiz:#CFC2E0; --nokta:#5A4475;
  }
  :root[data-theme="light"]{
    --ink:#2b2420; --ink-soft:#5c5248; --paper:#faf7f1; --paper-alt:#f1ebdf;
    --card:#ffffff; --line:#e5dcc9; --brand:#5b3a7a; --brand-dark:#402a58;
    --brand-text:#5b3a7a; --brand-soft:#efe7f5; --gold:#b8863b; --gold-lt:#e4a848;
    --radius:14px; --shadow:0 10px 30px -12px rgba(43,36,32,.18);
    --statik:#1F5FC4; --dinamik:#C8323A; --eksik:#8A84A3; --eksen:#B8863B; --seviye:#2A8A57;
    --yildiz:#241B3D; --nokta:#CFC6DF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;}
  h1,h2,h3,h4{font-family:'Cinzel',Georgia,serif;font-weight:600;color:var(--ink);margin:0 0 .5em;letter-spacing:.01em;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  @media(min-width:640px){.wrap{padding:0 24px;}}
  .eyebrow{display:inline-block;font-family:'Cinzel',serif;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-text);font-weight:600;margin-bottom:8px;}

  header.site{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:16px;}
  .nav .brand{display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-weight:700;font-size:1.1rem;color:var(--brand-text);text-decoration:none;}
  .nav .brand img{width:32px;height:32px;object-fit:contain;border-radius:8px;}
  .theme-toggle{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);}
  .theme-toggle svg{width:18px;height:18px;}
  .theme-toggle .moon{display:none;}
  :root[data-theme="light"] .theme-toggle .sun{display:none;}
  :root[data-theme="light"] .theme-toggle .moon{display:block;}

  main{padding:36px 0 90px;}
  .intro{margin-bottom:22px;}
  .intro h1{font-size:1.9rem;}
  .intro p{color:var(--ink-soft);margin:0;max-width:720px;}

  .calc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);margin-bottom:28px;}
  .form-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:720px){.form-grid{grid-template-columns:2fr 1fr;}}
  .field label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .date-row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;}
  input[type="text"],input[type="number"]{width:100%;font-size:1.1rem;padding:12px 14px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--paper-alt);color:var(--ink);font-family:inherit;}
  input[type="number"]{-moz-appearance:textfield;text-align:center;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;min-height:46px;border-radius:999px;font-weight:700;font-size:1rem;border:1px solid transparent;cursor:pointer;background:var(--brand);color:#fff;font-family:inherit;}
  .btn:hover{background:#54307F;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn.ghost:hover{color:var(--ink);border-color:var(--gold);}
  .err{color:#e07a5f;font-weight:600;min-height:1.4em;margin-top:10px;}

  .mod{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:22px;}
  .mod h2{font-size:1.25rem;color:var(--brand-dark);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .mod h2 .no{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:.06em;}
  .mod .lead{color:var(--ink-soft);margin:-4px 0 16px;}

  .hero{display:grid;grid-template-columns:1fr;gap:22px;align-items:start;}
  @media(min-width:900px){.hero{grid-template-columns:1.25fr 1fr;}}
  .person{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:700;color:var(--ink);margin:0;}
  .date-big{font-size:1.25rem;font-weight:700;color:var(--ink-soft);margin:2px 0 16px;letter-spacing:.04em;}
  .kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .kv{background:var(--paper-alt);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .kv .k{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .kv .v{font-size:1.6rem;font-weight:700;color:var(--ink);line-height:1.25;margin-top:4px;}
  .kv .s{font-size:.92rem;color:var(--ink-soft);margin-top:2px;}
  .kv.gold{border-color:var(--gold);}
  .kv.gold .v{color:var(--gold);}

  .svg-box{background:var(--paper-alt);border:1px solid var(--line);border-radius:14px;padding:8px;}
  .svg-box svg{width:100%;height:auto;display:block;}
  .toggles{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.92rem;color:var(--ink-soft);}
  .toggles label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.9rem;font-weight:600;}
  .legend .st{color:var(--statik);} .legend .dy{color:var(--dinamik);} .legend .ek{color:var(--eksik);}
  .legend .ax{color:var(--eksen);} .legend .lv{color:var(--seviye);}

  svg .star{stroke:var(--yildiz);stroke-width:3.2;fill:none;stroke-linejoin:round;opacity:.85;}
  svg .axis{stroke:var(--eksen);stroke-width:4;stroke-linecap:round;}
  svg .level{stroke:var(--seviye);stroke-width:4;stroke-dasharray:14 9;stroke-linecap:round;}
  svg .pt{fill:var(--nokta);stroke:var(--yildiz);stroke-width:1.2;}
  svg .pt.dolu{fill:var(--gold);stroke:var(--gold);}
  svg .ptno{fill:var(--ink-soft);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;}
  svg .ptno.dolu{fill:#241B3D;}
  svg .t-st{fill:var(--statik);font-weight:700;font-size:34px;}
  svg .t-dy{fill:var(--dinamik);font-weight:700;font-size:34px;}
  svg .t-ek{fill:var(--eksik);font-weight:700;font-size:30px;}
  svg .c-dy{fill:none;stroke:var(--dinamik);stroke-width:2.4;}
  svg .c-ek{fill:none;stroke:var(--eksik);stroke-width:2;stroke-dasharray:5 4;}
  svg .title{fill:var(--ink);font-weight:700;font-size:28px;text-anchor:middle;}
  svg text{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:1rem;}
  th,td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top;}
  th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;}
  td.num{font-weight:700;font-size:1.15rem;white-space:nowrap;}
  .st{color:var(--statik);font-weight:700;}
  .dy{color:var(--dinamik);font-weight:700;}
  .ek{color:var(--eksik);font-weight:600;}
  .muted{color:var(--ink-soft);}
  .count-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;}
  .count-row div{background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 2px;}
  .count-row b{display:block;font-size:.75rem;color:var(--ink-soft);}
  .count-row span{font-size:1.15rem;font-weight:700;}

  .cards{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:760px){.cards{grid-template-columns:1fr 1fr;}}
  .card{background:var(--paper-alt);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .card.off{opacity:.62;}
  .card h3{font-family:'Inter',sans-serif;font-size:1.05rem;font-weight:700;margin:0 0 4px;color:var(--ink);}
  .card .tag{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.04em;padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .tag.on{background:color-mix(in srgb, var(--seviye) 20%, transparent);color:var(--seviye);}
  .tag.no{background:color-mix(in srgb, var(--eksik) 20%, transparent);color:var(--eksik);}
  .card .desc{color:var(--ink-soft);font-size:.95rem;margin:4px 0 8px;}
  .formula{font-size:1.15rem;font-weight:700;margin:6px 0;word-break:break-word;}
  .formula .sum{color:var(--gold);}
  .readings{list-style:none;margin:6px 0 0;padding:0;font-size:.95rem;}
  .readings li{margin:3px 0;}
  .note{background:var(--brand-soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink-soft);font-size:.95rem;margin-top:14px;}
  ul.bul{margin:0;padding-left:0;list-style:none;}
  ul.bul li{margin:6px 0;}
  [hidden]{display:none !important;}
  #results{scroll-margin-top:76px;}
  @media(max-width:640px){
    .mod,.calc-card{padding:16px;}
    .svg-box{padding:2px;}
    .count-row{grid-template-columns:repeat(5,minmax(0,1fr));}
    .intro h1{font-size:1.6rem;}
    th,td{padding:8px 6px;}
  }

  @media print{
    header.site,.calc-card,.toggles,.no-print{display:none !important;}
    body{background:#fff;color:#000;}
    .mod,.card{break-inside:avoid;}
  }
</style>
</head>
<body>
<header class="site">
  <div class="wrap nav">
    <a class="brand" href="#"><img src="assets/sistem-logosu.png" alt="">Pentagram</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Tema değiştir">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="intro">
      <span class="eyebrow">NumeroLogic · Bölüm 1</span>
      <h1>Pentagram Hesaplama</h1>
      <p>İsim soyisim ve doğum tarihini girin. Uygulama pentagramı çizer, statik ve dinamik sayıları yerleştirir; arketipi, eksenleri, seviyeleri, üçgenleri, kadranları, beşgenleri ve trikolonları hesaplar.</p>
    </div>

    <form class="calc-card" id="form" autocomplete="off" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="isim">İsim Soyisim</label>
          <input type="text" id="isim" placeholder="Örn. Ayşe Yılmaz">
        </div>
        <div class="field">
          <label for="gun">Doğum Tarihi (Gün · Ay · Yıl)</label>
          <div class="date-row">
            <input type="number" id="gun" placeholder="Gün" min="1" max="31" inputmode="numeric">
            <input type="number" id="ay" placeholder="Ay" min="1" max="12" inputmode="numeric">
            <input type="number" id="yil" placeholder="Yıl" min="1000" max="2999" inputmode="numeric">
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">⭐ Pentagramı Hesapla</button>
        <button class="btn ghost no-print" type="button" id="printBtn" hidden>🖨️ Yazdır / PDF</button>
      </div>
      <div class="err" id="err"></div>
    </form>

    <div id="results" hidden></div>
  </div>
</main>

<script id="pentagram-motor">
/* ============================================================
   PENTAGRAM HESAP MOTORU — "Pentagramı Okumak, Bölüm 1" sunumundaki
   kurallar. Noktalar 1..10 (10. nokta eksen/seviye adlarında "0").
   ============================================================ */
var PENTAGRAM = (function(){
  var ARKETIPLER = {
    12:'Baş Rahip / Başrahibe', 13:'Sanatçı – Yaratıcı – Girişimci', 14:'Bilgin – Bilge',
    15:'Peygamber – Vaiz', 16:'Usta', 17:'Dünyevi Kral / Kraliçe',
    18:'Şifacı', 19:'Simyacı', 10:'Büyücü'
  };

  /* Yalnızca sunumda açıkça adı verilen sayı anlamları */
  var ANLAMLAR = {
    10:'Dönüşüm', 12:'Mükemmellik, Tamamlanma', 15:'Denge ve Karşılıklı Döllenme',
    23:'Koşulsuz Sevgi', 24:'Gündüz ve Gece, Işık ve Karanlık', 28:'Sezgisel Kadınlık',
    31:'İlahi Rehberlik', 32:'İlahi Bağlantı', 33:'Ruhun Yenilenmesi', 37:'Genişleme',
    39:'Burada ve şimdi tam uyanık olmak', 42:'Kozmik Sevgi', 46:'Diplomasi veya Kader',
    54:'Reformcu', 56:'Kader', 65:'İlahi Cinsellik', 67:'Hayatın sınırlarını test etmek',
    79:'Hükümdar / Yargıç', 97:'Adalet Faktörü', 101:'Kutsallık Faktörü',
    157:'Hayati Sihirli Üçgen — Karizma', 256:'İnsanın temel titreşimi'
  };

  var ARA_USTA = {
    15:'Denge ve Karşılıklı Döllenme üzerinden gelen ustalık.',
    24:'Gündüz ve Gece, Işık ve Karanlık üzerinden gelen ustalık.',
    33:'Ruhun Yenilenmesi üzerinden gelen ustalık.',
    42:'Kozmik Sevgi üzerinden gelen ustalık.'
  };

  var EKSENLER = [
    {n:[1,6], ad:'Azim', aciklama:'Tek dikey eksendir — omurgadır. "Tanrı" alemini "Ego" alemiyle birleştirir.'},
    {n:[2,7], ad:'Öz Farkındalık', aciklama:'"Ben kimim?" sorusuna en derin cevabı bulmak.'},
    {n:[3,8], ad:'İlişkiler', aciklama:''},
    {n:[4,9], ad:'Tutunmak mı, bırakmak mı?', aciklama:''},
    {n:[5,10], ad:'Değişim, Dönüşüm', aciklama:'İlkel kaosu içsel bir düzenle fiziksel genişlemeye bağlamak.'}
  ];
  var SEVIYELER = [
    {n:[2,10], ad:'Ruhsal', aciklama:'Sezgi, koşulsuz sevgi, evrenle birlik.'},
    {n:[3,9], ad:'Zihinsel', aciklama:'Düşünceler, inançlar, dünya görüşü.'},
    {n:[4,8], ad:'Duygusal', aciklama:'İlişkiler, istekler, güç meseleleri.'},
    {n:[5,7], ad:'Fiziksel', aciklama:'Beden, para, iş, güvenlik, cinsellik.'}
  ];
  var UCGENLER = [
    {n:[1,2,10], ad:'Ruhsal üçgen', alem:'Tanrı', aciklama:'Güçlü ilham, sezgi ve hayata bütünsel bir yaklaşım sağlar. Zorluk: bu ruhsal enerjiyi gerçek hayata taşımak; bunun için gölgeyi kabul edip bütünleştirmek gerekir.'},
    {n:[1,3,9], ad:'Zihinsel üçgen', alem:'Tanrı', aciklama:'İlham verici düşünceler, yaratıcı kavramlar ve yenilikçi inanç sistemleri sağlar. Ayrıca ilhamı anlama ve rasyonel işleme ihtiyacı doğurur.'},
    {n:[1,4,8], ad:'Duygusal üçgen', alem:'Tanrı', aciklama:'Adanmışlık duyguları, ilham alma ve coşku duyma arzusu verir.'},
    {n:[1,5,7], ad:'Fiziksel üçgen — Sihirli Canlılık', alem:'Tanrı', aciklama:'Bu üçgene sahip kişiler enerji, canlılık ve sihir yaymalıdır; yaymıyorlarsa potansiyellerini kullanmıyorlardır.'},
    {n:[6,2,10], ad:'Öncü üçgeni', alem:'Ego', aciklama:'Zamanının ötesinde bir kişiyi gösterir — "avant-gardist", yani öncü. Yüksek ruhsal farkındalık (2-0), birleşik "yaşam" enerjisiyle (6) buluşunca fikir kıvılcımları sonsuzdur.'},
    {n:[6,3,9], ad:'Hareket Ettirici ve Sarsıcı', alem:'Ego', aciklama:'İşleri gerçekten halleden bir kişiyi gösterir. Yüksek zihinsel farkındalık (3-9) bir konunun tüm mantığını anında kavrar.'},
    {n:[6,4,8], ad:'Güçlü duygusal üçgen', alem:'Ego', aciklama:'Duygusal seviye tamamen açık ve hassas olduğunda "dünyayı hissederiz". Travma çok fazlaysa kişi duygusal olarak dengesiz hale gelebilir.'},
    {n:[6,5,7], ad:'Güçlü fiziksel üçgen', alem:'Ego', aciklama:'Fiziksel farkındalık "yaşam" enerjisiyle bağlanıp serbestçe akarsa kişi sadece ev değil şehir inşa eder. Akmasına izin verilmezse kişi bencilleşebilir, daha fazlasına takıntılı olur ve asla tatmin olmaz.'}
  ];
  var KADRANLAR = [
    {n:[2,5,7,10], ad:'Ruhsal – fiziksel kadran (2-0 / 5-7)', aciklama:'Ruhsal düzey; öz farkındalığın genişlemesi (2-7) ve değişim-dönüşüm (5-0) yoluyla fiziksel olarak görünür olur.'},
    {n:[3,4,8,9], ad:'Zihinsel – duygusal kadran (3-9 / 4-8)', aciklama:'Düşünme ve inanç sistemleri; ilişki kurma (3-8) ve odaklanma (4-9) yoluyla duygular dünyasına bağlanır. Tuzak: duygular hakkında sonsuz düşünmek ya da duyguları mantıkla açıklamaya çalışmak.'}
  ];
  var BESGENLER = [
    {n:[1,3,5,7,9], ad:'Eril beşgen — yıldız gibi parlamak', etiket:'Parlaklık enerjisi', aciklama:'Kişinin "eril" genişleyici ışığını güçlendirir. Kişinin bir yıldız gibi parladığını hayal edin.'},
    {n:[2,4,6,8,10], ad:'Dişil beşgen — kadeh gibi almak', etiket:'Çekici ışıltı', aciklama:'Kişinin "dişil" çekici ışığını güçlendirir. Kişinin bir kadeh, bir enerji alıcısı olduğunu hayal edin.'}
  ];
  var TRIKOLONLAR = [
    {n:[1,4,7], ad:'Başlatıcı', aciklama:'Bir şeyi başlatma yeteneği: eylem, proje, ilişki. Bir şeyi ateşlemek için "kıvılcım" sağlar.'},
    {n:[2,5,8], ad:'Aracı', aciklama:'Taraflar arasında arabulucu, "motorun yağı" olma yeteneği. İletişim ve alışverişi mümkün kılar.'},
    {n:[3,6,9], ad:'Hareketlendirici', aciklama:'İşleri gerçekten halletme, sorunları çözme yeteneği.'}
  ];

  function rakamToplami(n){ var s = 0; String(n).split('').forEach(function(c){ s += +c; }); return s; }
  function noktaAdi(p){ return p === 10 ? '0' : String(p); }
  function rakamNoktasi(d){ return d === 0 ? 10 : d; }

  /* Sunumdaki asal sıralaması 1'i de sayar: 1, 2, 3, 5, 7, 11 … (ör. 67 = 20. asal, 157 = 38. asal) */
  function asalMi(n){ if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
  function asalSirasi(n){
    if (!asalMi(n)) return 0;
    var sira = 1; for (var i = 2; i <= n; i++) if (asalMi(i)) sira++;
    return sira;
  }
  function asalZinciri(n){
    var z = [], x = n;
    while (true){ var s = asalSirasi(x); if (!s) break; z.push([x, s]); if (s === x) break; x = s; }
    return z;
  }
  function okumaYollari(n){
    var r = {bolme:[], carpan:[], asal:asalZinciri(n)};
    var s = String(n);
    if (s.length >= 3){
      if (s.charAt(1) !== '0') r.bolme.push(s.slice(0,1) + '-' + s.slice(1));
      r.bolme.push(s.slice(0,-1) + '-' + s.slice(-1));
    }
    for (var a = 2; a * a <= n; a++) if (n % a === 0) r.carpan.push(a + ' × ' + (n / a));
    return r;
  }

  function hesapla(gun, ay, yil){
    var gunS = String(+gun), ayS = String(+ay), yilS = String(+yil);
    var yuzyil = yilS.slice(0, -2), yy = yilS.slice(-2);
    var kullanilan = (gunS + ayS + yy).split('').map(Number);
    var tumu = (gunS + ayS + yilS).split('').map(Number);

    var ara = tumu.reduce(function(a, b){ return a + b; }, 0);
    var zincir = [ara], n = ara;
    while (n > 11){ n = rakamToplami(n); zincir.push(n); }
    var cekirdek = n;
    var sayim = cekirdek === 11 ? 2 : cekirdek;   /* 11 → 1+1 = 2 */
    var pentagramNo = 10 + (sayim % 10);           /* "1" + çekirdek */

    var beklenen = {}, statik = {}, dinamik = {};
    for (var p = 1; p <= 10; p++){ beklenen[p] = ((sayim - 1) + (p - 1)) % 10 + 1; statik[p] = []; dinamik[p] = []; }
    kullanilan.forEach(function(d){
      var v = rakamNoktasi(d);
      statik[v].push(d);
      var q = (((v - sayim) % 10) + 10) % 10 + 1;
      dinamik[q].push(d);
    });

    var noktalar = {};
    for (var k = 1; k <= 10; k++){
      var sV = statik[k].length > 0, dV = dinamik[k].length > 0;
      var dRakam = beklenen[k] % 10;
      noktalar[k] = {
        no:k, statik:statik[k], dinamik:dinamik[k], beklenen:beklenen[k],
        dolu: sV || dV, statikVar: sV, dinamikVar: dV,
        tam: k * 10 + dRakam,
        terim: (sV ? String(k) : '(' + k + ')') + (dV ? String(dRakam) : '(' + dRakam + ')'),
        eksikStatik: dV && !sV ? noktaAdi(k) : null,
        eksikDinamik: sV && !dV ? String(dRakam) : null
      };
    }

    function yapi(tanim){
      var pts = tanim.n, olustu = pts.every(function(x){ return noktalar[x].dolu; });
      var o = {}; for (var key in tanim) o[key] = tanim[key];
      o.isim = pts.map(noktaAdi).join('-');
      o.olustu = olustu;
      o.bos = pts.filter(function(x){ return !noktalar[x].dolu; }).map(noktaAdi);
      if (olustu){
        o.toplam = pts.reduce(function(a, x){ return a + noktalar[x].tam; }, 0);
        o.formul = pts.map(function(x){ return noktalar[x].terim; }).join(' + ') + ' = ' + o.toplam;
        o.okuma = okumaYollari(o.toplam);
        o.tumStatik = pts.every(function(x){ return noktalar[x].statikVar; });
        o.tumDinamik = pts.every(function(x){ return noktalar[x].dinamikVar; });
      }
      return o;
    }

    return {
      gun:+gun, ay:+ay, yil:+yil, yuzyil:yuzyil, kullanilan:kullanilan,
      ara:ara, zincir:zincir, cekirdek:cekirdek, sayim:sayim,
      pentagramNo:pentagramNo, arketip:ARKETIPLER[pentagramNo],
      araUsta: sayim === 6 ? (ARA_USTA[ara] || null) : null,
      beklenen:beklenen, noktalar:noktalar,
      eksenler:EKSENLER.map(yapi), seviyeler:SEVIYELER.map(yapi), ucgenler:UCGENLER.map(yapi),
      kadranlar:KADRANLAR.map(yapi), besgenler:BESGENLER.map(yapi), trikolonlar:TRIKOLONLAR.map(yapi)
    };
  }

  return {hesapla:hesapla, ANLAMLAR:ANLAMLAR, ARKETIPLER:ARKETIPLER, noktaAdi:noktaAdi, asalSirasi:asalSirasi, okumaYollari:okumaYollari};
})();
if (typeof module !== 'undefined') module.exports = PENTAGRAM;
</script>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var son = null;
  var gorunum = {eksen:true, seviye:true, eksik:true};

  $('themeToggle').addEventListener('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (e) {}
  });
  $('printBtn').addEventListener('click', function(){ window.print(); });

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function anlam(n){ var a = PENTAGRAM.ANLAMLAR[n]; return a ? ' <span class="muted">· ' + esc(a) + '</span>' : ''; }

  /* ---------- Geometri ---------- */
  /* Sunumdaki çizimle aynı yerleşim: tek sayılar yıldızın uçlarında,
     çift sayılar kolların arasındaki boşluklarda (R'ye oranla). */
  var GEN = 720, CX = 360, CY = 352, R = 225;
  var ORAN = {
    1:[0,-1], 3:[-0.951,-0.309], 5:[-0.588,0.809], 7:[0.588,0.809], 9:[0.951,-0.309],
    2:[-0.45,-0.636], 10:[0.45,-0.636], 4:[-0.645,0.11], 8:[0.645,0.11], 6:[0,0.444]
  };
  function konum(p){
    var o = ORAN[p], u = Math.sqrt(o[0] * o[0] + o[1] * o[1]);
    return {x: CX + R * o[0], y: CY + R * o[1], ux: o[0] / u, uy: o[1] / u};
  }
  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function cizim(s){
    var svg = el('svg', {viewBox:'0 0 720 650', role:'img', 'aria-label':'Pentagram çizimi'});
    var tarih = s.gun + ' - ' + s.ay + ' - ' + s.yil;
    var t = el('text', {x:CX, y:40, 'class':'title'}, svg);
    t.textContent = tarih + '   ·   ' + araMetni(s);

    var y = [1,5,9,3,7].map(konum);
    el('polygon', {points: y.map(function(k){ return k.x.toFixed(1) + ',' + k.y.toFixed(1); }).join(' '), 'class':'star'}, svg);

    var N = s.noktalar;
    if (gorunum.seviye) s.seviyeler.forEach(function(v){
      if (!v.olustu) return;
      var a = konum(v.n[0]), b = konum(v.n[1]);
      el('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, 'class':'level'}, svg);
    });
    if (gorunum.eksen) s.eksenler.forEach(function(v){
      if (!v.olustu) return;
      var a = konum(v.n[0]), b = konum(v.n[1]);
      el('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, 'class':'axis'}, svg);
    });

    for (var p = 1; p <= 10; p++){
      var k = konum(p), nk = N[p];
      el('circle', {cx:k.x, cy:k.y, r:11, 'class':'pt' + (nk.dolu ? ' dolu' : '')}, svg);
      var no = el('text', {x:k.x, y:k.y + 0.5, 'class':'ptno' + (nk.dolu ? ' dolu' : '')}, svg);
      no.textContent = p;
      etiket(svg, p, nk, k);
    }
    return svg;
  }

  /* Statik (mavi) + sağında dinamik (kırmızı, halkalı) + eksik eş (gri, kesikli) */
  function etiket(svg, p, nk, k){
    var parcalar = [];
    if (nk.statikVar) parcalar.push({txt: nk.statik.join(' '), cls:'t-st'});
    else if (gorunum.eksik && nk.dinamikVar) parcalar.push({txt: nk.eksikStatik, cls:'t-ek', halka:'c-ek'});
    if (nk.dinamikVar) parcalar.push({txt: nk.dinamik.join(' '), cls:'t-dy', halka:'c-dy'});
    else if (gorunum.eksik && nk.statikVar) parcalar.push({txt: nk.eksikDinamik, cls:'t-ek', halka:'c-ek'});
    if (!parcalar.length) return;

    var bosluk = 12, toplam = 0;
    parcalar.forEach(function(q){
      var fs = q.cls === 't-ek' ? 30 : 34;
      q.w = q.txt.length * fs * 0.6 + (q.halka ? 18 : 0);
      toplam += q.w;
    });
    toplam += bosluk * (parcalar.length - 1);

    var uzak = (p % 2) ? 48 : 46;
    var ax = k.x + k.ux * uzak, ay = k.y + k.uy * uzak;
    if (p === 1) ay -= 4;
    if (p === 5 || p === 7) ay += 8;
    var kayma = toplam / 2 * Math.abs(k.ux) * 0.9;
    ax += k.ux >= 0 ? kayma : -kayma;
    var x = Math.max(6, Math.min(GEN - 6 - toplam, ax - toplam / 2));
    parcalar.forEach(function(q){
      var cx = x + q.w / 2;
      if (q.halka){
        var hw = q.w / 2, hh = 23;
        el('rect', {x:cx - hw, y:ay - hh, width:q.w, height:hh * 2, rx:hh, ry:hh, 'class':q.halka}, svg);
      }
      var tx = el('text', {x:cx, y:ay, 'class':q.cls, 'text-anchor':'middle', 'dominant-baseline':'central'}, svg);
      tx.textContent = q.txt;
      x += q.w + bosluk;
    });
  }

  function araMetni(s){
    if (s.zincir.length === 1) return String(s.cekirdek);
    return s.zincir.join(' / ');
  }

  /* ---------- Metin bölümleri ---------- */
  function okumaHtml(o){
    var r = o.okuma, li = [];
    li.push('<li>🔢 <b>' + o.toplam + '</b>' + anlam(o.toplam) + '</li>');
    if (r.asal.length) li.push('<li>✨ ' + r.asal.map(function(z){ return z[0] + ' = ' + z[1] + '. asal'; }).join(' · ') + '</li>');
    if (r.bolme.length) li.push('<li>✂️ Bölerek: ' + r.bolme.map(esc).join(' · ') + '</li>');
    if (r.carpan.length) li.push('<li>✖️ Çarpanlar: ' + r.carpan.join(' · ') + '</li>');
    return '<ul class="readings">' + li.join('') + '</ul>';
  }
  function tur(o){
    if (o.tumStatik && o.tumDinamik) return 'statik + dinamik';
    if (o.tumStatik) return 'statik';
    if (o.tumDinamik) return 'dinamik';
    return 'statik ve dinamik karışık';
  }
  function kart(o, opt){
    opt = opt || {};
    var h = '<div class="card' + (o.olustu ? '' : ' off') + '">';
    h += '<h3>' + esc(o.isim) + ' · ' + esc(o.ad) + '</h3>';
    if (o.olustu){
      h += '<span class="tag on">✅ Oluştu' + (opt.tur ? ' · ' + tur(o) : '') + '</span>';
      if (o.aciklama) h += '<div class="desc">' + esc(o.aciklama) + '</div>';
      h += '<div class="formula">' + (opt.etiket ? '<span class="muted">' + esc(opt.etiket) + ':</span> ' : '') + esc(o.formul).replace(/= (\d+)$/, '= <span class="sum">$1</span>') + '</div>';
      h += okumaHtml(o);
    } else {
      h += '<span class="tag no">⛔ Oluşmadı</span>';
      if (o.aciklama) h += '<div class="desc">' + esc(o.aciklama) + '</div>';
      h += '<div class="muted">Boş nokta: ' + o.bos.join(', ') + '</div>';
    }
    return h + '</div>';
  }
  function bolum(no, baslik, lead, ic){
    return '<section class="mod"><h2><span class="no">' + no + '</span>' + baslik + '</h2>' + (lead ? '<p class="lead">' + lead + '</p>' : '') + ic + '</section>';
  }

  function goster(isim, s){
    var N = s.noktalar, html = '';

    /* Üst bölüm: kişi + çizim */
    var kv = '';
    kv += '<div class="kv"><div class="k">Ara / Çekirdek Sayı</div><div class="v">' + araMetni(s) + '</div>' +
          (s.cekirdek === 11 ? '<div class="s">Pentagram için 1 + 1 = 2 alınır</div>' : '') + '</div>';
    kv += '<div class="kv gold"><div class="k">Pentagram (Arketip)</div><div class="v">' + s.pentagramNo + '</div><div class="s">' + esc(s.arketip) + '</div></div>';
    var dolu = 0, tek = 0, cift = 0;
    for (var p = 1; p <= 10; p++){ if (N[p].statikVar) dolu++; }
    s.kullanilan.forEach(function(d){ if (d % 2) tek++; else cift++; });
    kv += '<div class="kv"><div class="k">Statik Dolu / Boş Nokta</div><div class="v">' + dolu + ' / ' + (10 - dolu) + '</div><div class="s">Boş noktalar açılmamış hediyelerdir</div></div>';
    kv += '<div class="kv"><div class="k">Statik Tek / Çift Rakam</div><div class="v">' + tek + ' / ' + cift + '</div><div class="s">' + (tek > cift ? 'Dışa dönük, yayan (lamba)' : cift > tek ? 'İçe dönük, alıcı (kadeh)' : 'Dengede') + '</div></div>';

    var info = '<p class="person">' + esc(isim) + '</p>' +
      '<p class="date-big">' + s.gun + ' - ' + s.ay + ' - ' + s.yil + '</p>' +
      '<div class="kv-grid">' + kv + '</div>' +
      '<div class="note">💡 Pentagrama yazılan rakamlar: <b>' + s.kullanilan.join(' – ') + '</b>. Yüzyıl rakamları (' + esc(s.yuzyil) + ') ara sayı hesabına girer, pentagrama yazılmaz.' +
      (s.araUsta ? '<br>🎭 ' + s.ara + ' → 6: ' + esc(s.araUsta) : '') + '</div>';

    html += '<section class="mod"><div class="hero"><div>' +
      '<div class="svg-box" id="svgBox"></div>' +
      '<div class="toggles"><label><input type="checkbox" data-g="eksen"' + (gorunum.eksen ? ' checked' : '') + '> Eksenler</label>' +
      '<label><input type="checkbox" data-g="seviye"' + (gorunum.seviye ? ' checked' : '') + '> Seviyeler</label>' +
      '<label><input type="checkbox" data-g="eksik"' + (gorunum.eksik ? ' checked' : '') + '> Eksik eşler</label></div>' +
      '<div class="legend"><span class="st">● Statik</span><span class="dy">◯ Dinamik</span><span class="ek">◌ Eksik eş</span><span class="ax">━ Eksen</span><span class="lv">╍ Seviye</span></div>' +
      '</div><div>' + info + '</div></div></section>';

    /* Sayma tablosu */
    var sayma = '<div class="count-row">';
    for (var q = 1; q <= 10; q++) sayma += '<div><b>' + q + '. nokta</b><span>' + s.beklenen[q] + '</span></div>';
    sayma += '</div>';
    html += bolum('ADIM 4', 'Dinamik sayma', 'Çekirdek tip (' + s.sayim + ') 1. noktaya yazılmış gibi kabul edilir ve saat yönünün tersine bir tur sayılır. Tarihte bulunan rakamlar, beklenen değeri kendisi olan noktaya kırmızıyla yazılır.', '<div class="tbl-wrap">' + sayma + '</div>');

    /* 1.4 Tam potansiyel */
    var rows = '';
    for (var i = 1; i <= 10; i++){
      var n = N[i], durum;
      if (!n.dolu) durum = '<span class="muted">Boş</span>';
      else if (n.statikVar && n.dinamikVar) durum = 'Tam ✓';
      else if (n.statikVar) durum = 'Dinamik <span class="ek">' + n.eksikDinamik + '</span> eksik';
      else durum = 'Statik <span class="ek">' + n.eksikStatik + '</span> eksik';
      rows += '<tr><td class="num">' + i + '</td>' +
        '<td class="st">' + (n.statik.join(' ') || '—') + '</td>' +
        '<td class="dy">' + (n.dinamik.join(' ') || '—') + '</td>' +
        '<td>' + durum + '</td>' +
        '<td class="num">' + (n.dolu ? n.tam : '<span class="muted">—</span>') + (n.dolu ? anlam(n.tam) : '') + '</td></tr>';
    }
    html += bolum('1.4', 'Sayıların tam potansiyeli', 'Tek başına duran sayı eşini arar. Eksik eş tamamlanınca iki basamaklı tam sayı çıkar; asıl anlam o tam sayıdadır.',
      '<div class="tbl-wrap"><table><thead><tr><th>Nokta</th><th>Statik</th><th>Dinamik</th><th>Durum</th><th>Tam sayı</th></tr></thead><tbody>' + rows + '</tbody></table></div>');

    html += bolum('1.5', 'Eksenler', 'Eksen, çözülmesi gereken bir paradokstur. İki ucun tam sayılarının toplamı eksenin teması ve amacıdır.',
      '<div class="cards">' + s.eksenler.map(function(o){ return kart(o, {tur:true, etiket:'Eksenin teması'}); }).join('') + '</div>');
    html += bolum('1.6', 'Seviyeler', 'Seviye ancak her iki ucunda da sayı varsa oluşur. İki ucun tam sayılarının toplamı seviyenin hedefidir.',
      '<div class="cards">' + s.seviyeler.map(function(o){ return kart(o, {tur:true, etiket:'Seviyenin hedefi'}); }).join('') + '</div>');
    html += bolum('1.7', 'Üçgenler', 'Bir seviye 1. ilke ("Tanrı" alemi) ya da 6. ilke ("Ego" alemi) ile bağlandığında üçgen oluşur. Üçgenin enerjisi üç konumun tam sayılarının toplamıdır.',
      '<div class="cards">' + s.ucgenler.map(function(o){ return kart(o, {etiket:'Üçgenin enerjisi'}); }).join('') + '</div>');
    html += bolum('1.8', 'Kadranlar', 'İki seviye iki eksenle bağlandığında kadran oluşur. Genel tema, dört köşenin tam sayılarının toplamıdır.',
      '<div class="cards">' + s.kadranlar.map(function(o){ return kart(o, {etiket:'Toplam'}); }).join('') + '</div>');
    html += bolum('1.9', 'Beşgenler', 'Tüm dış noktalar (1-3-5-7-9) ya da tüm iç noktalar (2-4-6-8-0) dolduğunda beşgen oluşur.',
      '<div class="cards">' + s.besgenler.map(function(o){ return kart(o, {etiket:o.etiket}); }).join('') + '</div>');
    html += bolum('1.10', 'Trikolonlar', 'Üç konum da pentagramda bir sayı taşıdığında ilgili trikolon enerjisi aktive olur.',
      '<div class="cards">' + s.trikolonlar.map(function(o){ return kart(o, {etiket:'Toplam'}); }).join('') + '</div>');

    html += '<div class="note">📘 Gösterim: parantez içindeki rakam eksik eştir — <b>1(5)</b> statik 1 var, dinamik 5 eksik; <b>(6)4</b> statik 6 eksik, dinamik 4 var. Asal sıralaması sunumdaki gibi 1\'den başlar (1, 2, 3, 5, 7 …). Sayı anlamları yalnızca sunumda adı geçen sayılar için gösterilir.</div>';

    $('results').innerHTML = html;
    $('results').hidden = false;
    $('printBtn').hidden = false;
    $('svgBox').appendChild(cizim(s));
    Array.prototype.forEach.call(document.querySelectorAll('.toggles input'), function(cb){
      cb.addEventListener('change', function(){
        gorunum[cb.getAttribute('data-g')] = cb.checked;
        var box = $('svgBox'); box.innerHTML = ''; box.appendChild(cizim(son.s));
      });
    });
  }

  function gecerliTarih(g, a, y){
    if (!(g >= 1 && a >= 1 && a <= 12 && y >= 1000 && y <= 2999)) return false;
    var d = new Date(Date.UTC(y, a - 1, g));
    return d.getUTCFullYear() === y && d.getUTCMonth() === a - 1 && d.getUTCDate() === g;
  }

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var isim = $('isim').value.trim();
    var g = parseInt($('gun').value, 10), a = parseInt($('ay').value, 10), y = parseInt($('yil').value, 10);
    if (!isim){ $('err').textContent = 'Lütfen isim soyisim girin.'; return; }
    if (!gecerliTarih(g, a, y)){ $('err').textContent = 'Lütfen geçerli bir doğum tarihi girin (gün, ay, dört haneli yıl).'; return; }
    $('err').textContent = '';
    son = {isim:isim, s:PENTAGRAM.hesapla(g, a, y)};
    goster(isim, son.s);
    $('results').scrollIntoView({behavior:'smooth', block:'start'});
  });
})();
</script>
</body>
</html>
