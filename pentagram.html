<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pentagram Hesaplama Uygulaması</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/sistem-logosu.png" type="image/png">
<script>
  (function(){
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F3EAE0; --ink-soft:#CFC2E0; --paper:#140A1E; --paper-alt:#1B0F2A;
    --card:#221336; --line:#3A2050; --brand:#6B3FA0; --brand-dark:#E4D4F5;
    --brand-text:#C9A6EA; --brand-soft:rgba(124,79,176,.16);
    --gold:#E4A848; --gold-lt:#F5D89C; --radius:16px;
    --shadow:0 24px 60px -24px rgba(0,0,0,.7); font-size:16px;
    --statik:#7FB2FF; --dinamik:#FF7A7A; --eksik:#9F97BC; --eksen:#E4A848; --seviye:#4CC98A;
    --yildiz:#CFC2E0; --nokta:#5A4475;
  }
  :root[data-theme="light"]{
    --ink:#2b2420; --ink-soft:#5c5248; --paper:#faf7f1; --paper-alt:#f1ebdf;
    --card:#ffffff; --line:#e5dcc9; --brand:#5b3a7a; --brand-dark:#402a58;
    --brand-text:#5b3a7a; --brand-soft:#efe7f5; --gold:#b8863b; --gold-lt:#e4a848;
    --radius:14px; --shadow:0 10px 30px -12px rgba(43,36,32,.18);
    --statik:#1F5FC4; --dinamik:#C8323A; --eksik:#8A84A3; --eksen:#B8863B; --seviye:#2A8A57;
    --yildiz:#241B3D; --nokta:#CFC6DF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;}
  h1,h2,h3,h4{font-family:'Cinzel',Georgia,serif;font-weight:600;color:var(--ink);margin:0 0 .5em;letter-spacing:.01em;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px;}
  @media(min-width:640px){.wrap{padding:0 24px;}}
  .eyebrow{display:inline-block;font-family:'Cinzel',serif;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-text);font-weight:600;margin-bottom:8px;}

  header.site{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:16px;}
  .nav .brand{display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-weight:700;font-size:1.1rem;color:var(--brand-text);text-decoration:none;}
  .nav .brand img{width:32px;height:32px;object-fit:contain;border-radius:8px;}
  .theme-toggle{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);}
  .theme-toggle svg{width:18px;height:18px;}
  .theme-toggle .moon{display:none;}
  :root[data-theme="light"] .theme-toggle .sun{display:none;}
  :root[data-theme="light"] .theme-toggle .moon{display:block;}

  main{padding:32px 0 90px;}
  .intro{margin-bottom:20px;}
  .intro h1{font-size:1.9rem;}
  .intro p{color:var(--ink-soft);margin:0;max-width:760px;}

  .calc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px;}
  .form-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:720px){.form-grid{grid-template-columns:2fr 1.3fr;}}
  .field label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .date-row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;}
  input[type="text"],input[type="number"],select{width:100%;font-size:1.1rem;padding:12px 14px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--paper-alt);color:var(--ink);font-family:inherit;}
  input[type="number"]{-moz-appearance:textfield;text-align:center;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  details.partner{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;}
  details.partner summary{cursor:pointer;font-weight:700;color:var(--brand-text);}
  details.partner .form-grid{margin-top:12px;}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;min-height:46px;border-radius:999px;font-weight:700;font-size:1rem;border:1px solid transparent;cursor:pointer;background:var(--brand);color:#fff;font-family:inherit;}
  .btn:hover{background:#54307F;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn.ghost:hover{color:var(--ink);border-color:var(--gold);}
  .err{color:#e07a5f;font-weight:600;min-height:1.4em;margin-top:10px;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin-bottom:14px;position:sticky;top:64px;z-index:40;background:var(--paper);}
  .tab{flex:0 0 auto;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .panel[hidden]{display:none;}

  .mod{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
  .mod h2{font-size:1.25rem;color:var(--brand-dark);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .mod h2 .no{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:.06em;}
  .mod .lead{color:var(--ink-soft);margin:-4px 0 14px;}
  .mod h3.sub{font-family:'Inter',sans-serif;font-size:1.05rem;font-weight:700;margin:18px 0 8px;}

  .hero{display:grid;grid-template-columns:1fr;gap:22px;align-items:start;}
  @media(min-width:900px){.hero{grid-template-columns:1.2fr 1fr;}}
  .person{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:700;color:var(--ink);margin:0;}
  .date-big{font-size:1.2rem;font-weight:700;color:var(--ink-soft);margin:2px 0 14px;letter-spacing:.04em;}
  .kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .kv{background:var(--paper-alt);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .kv .k{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .kv .v{font-size:1.55rem;font-weight:700;color:var(--ink);line-height:1.25;margin-top:4px;}
  .kv .s{font-size:.92rem;color:var(--ink-soft);margin-top:2px;}
  .kv.gold{border-color:var(--gold);}
  .kv.gold .v{color:var(--gold);}

  .svg-box{background:var(--paper-alt);border:1px solid var(--line);border-radius:14px;padding:8px;}
  .svg-box svg{width:100%;height:auto;display:block;}
  .toggles{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.92rem;color:var(--ink-soft);}
  .toggles label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.9rem;font-weight:600;}
  .legend .st{color:var(--statik);} .legend .dy{color:var(--dinamik);} .legend .ek{color:var(--eksik);}
  .legend .ax{color:var(--eksen);} .legend .lv{color:var(--seviye);}

  svg .star{stroke:var(--yildiz);stroke-width:3.2;fill:none;stroke-linejoin:round;opacity:.85;}
  svg .axis{stroke:var(--eksen);stroke-width:4;stroke-linecap:round;}
  svg .level{stroke:var(--seviye);stroke-width:4;stroke-dasharray:14 9;stroke-linecap:round;}
  svg .pt{fill:var(--nokta);stroke:var(--yildiz);stroke-width:1.2;}
  svg .pt.dolu{fill:var(--gold);stroke:var(--gold);}
  svg .ptno{fill:var(--ink-soft);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;}
  svg .ptno.dolu{fill:#241B3D;}
  svg .t-st{fill:var(--statik);font-weight:700;font-size:34px;}
  svg .t-dy{fill:var(--dinamik);font-weight:700;font-size:34px;}
  svg .t-ek{fill:var(--eksik);font-weight:700;font-size:30px;}
  svg .c-dy{fill:none;stroke:var(--dinamik);stroke-width:2.4;}
  svg .c-ek{fill:none;stroke:var(--eksik);stroke-width:2;stroke-dasharray:5 4;}
  svg .title{fill:var(--ink);font-weight:700;font-size:28px;text-anchor:middle;}
  svg text{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
  svg .spine{stroke:var(--brand-text);stroke-width:9;fill:none;stroke-linecap:round;}
  svg .bpt{fill:var(--nokta);}
  svg .bpt.on{fill:var(--gold);}
  svg .bno{fill:var(--ink);font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:central;}
  svg .bno.on{fill:#241B3D;}
  svg .blabel{fill:var(--ink-soft);font-size:31px;font-weight:600;dominant-baseline:central;}
  svg .arrow{stroke:var(--dinamik);stroke-width:4;fill:none;}
  svg .arrowhead{fill:var(--dinamik);}

  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:1rem;}
  th,td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top;}
  th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;}
  td.num{font-weight:700;font-size:1.15rem;white-space:nowrap;}
  .st{color:var(--statik);font-weight:700;}
  .dy{color:var(--dinamik);font-weight:700;}
  .ek{color:var(--eksik);font-weight:600;}
  .muted{color:var(--ink-soft);}
  .gold-t{color:var(--gold);font-weight:700;}
  .count-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;}
  .count-row div{background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 2px;}
  .count-row b{display:block;font-size:.75rem;color:var(--ink-soft);}
  .count-row span{font-size:1.15rem;font-weight:700;}

  .cards{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:760px){.cards{grid-template-columns:1fr 1fr;}}
  .card{background:var(--paper-alt);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .card.off{opacity:.62;}
  .card h3{font-family:'Inter',sans-serif;font-size:1.05rem;font-weight:700;margin:0 0 4px;color:var(--ink);}
  .card .tag{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.04em;padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .tag.on{background:color-mix(in srgb, var(--seviye) 20%, transparent);color:var(--seviye);}
  .tag.no{background:color-mix(in srgb, var(--eksik) 20%, transparent);color:var(--eksik);}
  .card .desc{color:var(--ink-soft);font-size:.95rem;margin:4px 0 8px;}
  .formula{font-size:1.15rem;font-weight:700;margin:6px 0;word-break:break-word;}
  .formula .sum{color:var(--gold);}
  .readings{list-style:none;margin:6px 0 0;padding:0;font-size:.95rem;}
  .readings li{margin:4px 0;}
  .note{background:var(--brand-soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink-soft);font-size:.95rem;margin-top:14px;}
  .warn{background:color-mix(in srgb, var(--dinamik) 12%, transparent);border:1px solid color-mix(in srgb, var(--dinamik) 35%, transparent);border-radius:12px;padding:12px 16px;font-size:.95rem;margin-top:14px;}
  ul.bul{margin:0;padding-left:0;list-style:none;}
  ul.bul li{margin:7px 0;}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:1px 10px;font-weight:700;font-size:.95em;cursor:pointer;font-family:inherit;}
  .chip:hover{border-color:var(--gold);color:var(--gold);}
  .def{color:var(--ink-soft);}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0;}
  .steps>li{counter-increment:s;position:relative;padding:12px 14px 12px 54px;border:1px solid var(--line);border-radius:12px;background:var(--paper-alt);margin-bottom:10px;}
  .steps>li::before{content:counter(s);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
  .steps>li b.t{display:block;margin-bottom:2px;}
  .steps>li.bos{opacity:.6;}
  .steps>li.ekyol{counter-increment:none;border-style:dashed;}
  .steps>li.ekyol::before{content:'+';background:var(--gold);}
  .harf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;}
  .harf-grid div{background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;}
  .harf-grid b{display:block;font-size:1.1rem;}
  .coz-in{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .coz-in input{max-width:220px;}
  [hidden]{display:none !important;}
  #results{scroll-margin-top:76px;}
  @media(max-width:640px){
    .mod,.calc-card{padding:16px;}
    .svg-box{padding:2px;}
    .count-row{grid-template-columns:repeat(5,minmax(0,1fr));}
    .intro h1{font-size:1.6rem;}
    th,td{padding:8px 6px;}
    .tabs{top:60px;}
  }
  @media print{
    header.site,.calc-card,.toggles,.no-print,.tabs,.coz-in{display:none !important;}
    .panel[hidden]{display:block !important;}
    body{background:#fff;color:#000;}
    .mod,.card{break-inside:avoid;}
  }
</style>
</head>
<body>
<header class="site">
  <div class="wrap nav">
    <a class="brand" href="#"><img src="assets/sistem-logosu.png" alt="">Pentagram</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Tema değiştir">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="intro">
      <span class="eyebrow">NumeroLogic · Pentagram</span>
      <h1>Pentagram Hesaplama</h1>
      <p>İsim soyisim ve doğum tarihini girin. Uygulama Doğum Pentagramını, Gölge Pentagramını ve Vücut Resmini çizer; zaman hesaplarını, isim analizini ve her sayının çözümlemesini çıkarır.</p>
    </div>

    <form class="calc-card" id="form" autocomplete="off" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="isim">İsim Soyisim</label>
          <input type="text" id="isim" placeholder="Örn. Ayşe Yılmaz">
        </div>
        <div class="field">
          <label for="gun">Doğum Tarihi (Gün · Ay · Yıl)</label>
          <div class="date-row">
            <input type="number" id="gun" placeholder="Gün" min="1" max="31" inputmode="numeric">
            <input type="number" id="ay" placeholder="Ay" min="1" max="12" inputmode="numeric">
            <input type="number" id="yil" placeholder="Yıl" min="1000" max="2999" inputmode="numeric">
          </div>
        </div>
      </div>
      <details class="partner" id="partnerBox">
        <summary>💞 İlişki hesabı için partner (isteğe bağlı)</summary>
        <div class="form-grid">
          <div class="field">
            <label for="pIsim">Partnerin İsim Soyisimi</label>
            <input type="text" id="pIsim" placeholder="Örn. Mehmet Yılmaz">
          </div>
          <div class="field">
            <label for="pGun">Partnerin Doğum Tarihi</label>
            <div class="date-row">
              <input type="number" id="pGun" placeholder="Gün" min="1" max="31" inputmode="numeric">
              <input type="number" id="pAy" placeholder="Ay" min="1" max="12" inputmode="numeric">
              <input type="number" id="pYil" placeholder="Yıl" min="1000" max="2999" inputmode="numeric">
            </div>
          </div>
        </div>
      </details>
      <div class="actions">
        <button class="btn" type="submit">⭐ Pentagramı Hesapla</button>
        <button class="btn ghost no-print" type="button" id="printBtn" hidden>🖨️ Yazdır / PDF</button>
      </div>
      <div class="err" id="err"></div>
    </form>

    <div id="results" hidden>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div id="panels"></div>
    </div>
  </div>
</main>

<script id="pentagram-motor">

    87:'Hermafrodit; Sanat ve Moda', 89:'Dışsal mutluluk', 92:'Öngörülemez zekâ',
    93:'Zamanın Ruhu (Zeitgeist)', 95:'Alçalan (indiren) peygamber', 96:'Manyetik iyileştirme',
    97:'Adalet Faktörü; Ustalık', 101:'Kutsallık Faktörü', 103:'Çözülme ve Yenilenme',

  var HARFLER = {A:1,B:2,C:3,D:5,E:7,F:11,G:13,H:17,I:19,J:23,K:29,L:31,M:37,N:41,O:43,P:47,Q:53,R:59,S:61,T:67,U:71,V:73,W:79,X:83,Y:89,Z:97};
  var TR_HARF = {'Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U','Â':'A','Î':'I','Û':'U'};

  /* ---------- Temel araçlar ---------- */
  function rakamlar(s){ return String(s).split('').map(Number); }
  function rakamToplami(n){ return rakamlar(n).reduce(function(a, b){ return a + b; }, 0); }
  function noktaAdi(p){ return p === 10 ? '0' : String(p); }

  /* Asal listesi — bu sistemde 1 de asaldır ve 1. sıradadır (1, 2, 3, 5, 7, 11 …) */
  var ASALLAR = [1], SIRA = {1:1}, ELEK_UST = 1;
  function eleGenislet(ust){
    if (ust <= ELEK_UST) return;
    var b = new Uint8Array(ust + 1), i, j;
    for (i = 2; i * i <= ust; i++) if (!b[i]) for (j = i * i; j <= ust; j += i) b[j] = 1;
    ASALLAR = [1]; SIRA = {1:1};
    for (i = 2; i <= ust; i++) if (!b[i]){ ASALLAR.push(i); SIRA[i] = ASALLAR.length; }
    ELEK_UST = ust;
  }
  eleGenislet(20000);
  function asalMi(n){ if (n > ELEK_UST) eleGenislet(n * 2); return !!SIRA[n]; }
  function asalSirasi(n){ return asalMi(n) ? SIRA[n] : 0; }
  function nAsal(k){ while (ASALLAR.length < k) eleGenislet(ELEK_UST * 2); return ASALLAR[k - 1]; }
  function asalZinciri(n){
    var z = [], x = n;
    while (true){ var s = asalSirasi(x); if (!s) break; z.push([x, s]); if (s === x) break; x = s; }
    return z;
  }

  /* ---------- Titreşim (ara / çekirdek) ---------- */
  function indirge(ara){
    var zincir = [ara], n = ara;
    while (n > 11){ n = rakamToplami(n); zincir.push(n); }   /* 19, 28, 37, 46 → 10'da durulur */
    var sayim = n === 11 ? 2 : n;                            /* 11 → 1 + 1 = 2 */
    return {ara:ara, zincir:zincir, cekirdek:n, sayim:sayim, pentagramNo:10 + (sayim % 10), arketip:ARKETIPLER[10 + (sayim % 10)]};
  }
  function titresim(tumRakamlar){
    var ara = tumRakamlar.reduce(function(a, b){ return a + b; }, 0);
    var t = indirge(ara);
    var sifir = tumRakamlar.filter(function(d){ return d === 0; }).length;
    t.sifirSayisi = sifir;
    t.ekler = [];                                             /* Sıfır kuralı: her 0 için +10 */
    for (var i = 1; i <= sifir; i++) t.ekler.push(indirge(ara + 10 * i));
    return t;
  }

  /* ---------- Pentagram yerleşimi ---------- */
  function pentagram(pentRakamlari, sayim, sadeceDinamik){
    var beklenen = {}, statik = {}, dinamik = {};
    for (var p = 1; p <= 10; p++){ beklenen[p] = ((sayim - 1) + (p - 1)) % 10 + 1; statik[p] = []; dinamik[p] = []; }
    pentRakamlari.forEach(function(d){
      var v = d === 0 ? 10 : d;
      if (!sadeceDinamik) statik[v].push(d);
      dinamik[(((v - sayim) % 10) + 10) % 10 + 1].push(d);
    });
    var N = {};
    for (var k = 1; k <= 10; k++){
      var sV = statik[k].length > 0, dV = dinamik[k].length > 0, dR = beklenen[k] % 10;
      N[k] = {
        no:k, statik:statik[k], dinamik:dinamik[k], beklenen:beklenen[k],
        dolu: sV || dV, statikVar: sV, dinamikVar: dV, tam: k * 10 + dR,
        terim: (sV ? String(k) : '(' + k + ')') + (dV ? String(dR) : '(' + dR + ')'),
        eksikStatik: dV && !sV ? noktaAdi(k) : null,
        eksikDinamik: sV && !dV ? String(dR) : null
      };
    }
    function yapi(tanim){
      var pts = tanim.n, o = {};
      for (var key in tanim) o[key] = tanim[key];
      o.isim = pts.map(noktaAdi).join('-');
      o.olustu = pts.every(function(x){ return N[x].dolu; });
      o.bos = pts.filter(function(x){ return !N[x].dolu; }).map(noktaAdi);
      if (o.olustu){
        o.parcalar = pts.map(function(x){ return N[x].tam; });
        o.toplam = o.parcalar.reduce(function(a, b){ return a + b; }, 0);
        o.formul = pts.map(function(x){ return N[x].terim; }).join(' + ') + ' = ' + o.toplam;
        o.tumStatik = pts.every(function(x){ return N[x].statikVar; });
        o.tumDinamik = pts.every(function(x){ return N[x].dinamikVar; });
      }
      return o;
    }
    return {
      beklenen:beklenen, noktalar:N,
      eksenler:EKSENLER.map(yapi), seviyeler:SEVIYELER.map(yapi), ucgenler:UCGENLER.map(yapi),
      kadranlar:KADRANLAR.map(yapi), besgenler:BESGENLER.map(yapi), trikolonlar:TRIKOLONLAR.map(yapi)
    };
  }

  /* Tarihi parçalara ayırır; donustur verilirse her rakam dönüştürülür */
  function tarihParcalari(g, a, y, donustur){
    var f = donustur || function(d){ return d; };
    function cevir(s){ return rakamlar(s).map(f).join(''); }
    var gS = cevir(String(+g)), aS = cevir(String(+a)), yS = cevir(String(+y));
    var yuzyil = yS.slice(0, -2), yy = yS.slice(-2);
    return {gun:gS, ay:aS, yil:yS, yuzyil:yuzyil, yy:yy,
            tum: rakamlar(gS + aS + yS), pent: rakamlar(gS + aS + yy),
            yazi: gS + '-' + aS + '-' + yS};
  }

  function harita(g, a, y, donustur, sadeceDinamik){
    var t = tarihParcalari(g, a, y, donustur);
    var tit = titresim(t.tum);
    var pent = pentagram(t.pent, tit.sayim, sadeceDinamik);
    return {tarih:t, titresim:tit, pent:pent};
  }

  var GOLGE = function(d){ return (d + 5) % 10; };            /* 1↔6, 2↔7, 3↔8, 4↔9, 5↔0 */
  var VUCUT = function(d){ return d === 2 ? 5 : d === 1 ? 6 : d === 0 ? 7 : d; };  /* 2→5, 1→6, 0→7 */

  function dogum(g, a, y){
    var h = harita(g, a, y);
    var yyN = +h.tarih.yy;
    h.persona = +g; h.ruh = +a; h.fiziksel = yyN;
    h.dusunme = (+g) + (+a);
    h.tepki = (+a) + yyN;
    h.araYasi = h.titresim.ara;
    h.araYili = (+y) + h.titresim.ara;
    h.araUsta = h.titresim.sayim === 6 ? (ARA_USTA[h.titresim.ara] || null) : null;
    return h;
  }
  function golge(g, a, y){ return harita(g, a, y, GOLGE); }
  function vucut(g, a, y){
    var h = harita(g, a, y, VUCUT, true);
    var oklar = [];
    for (var p = 1; p <= 10; p++) h.pent.noktalar[p].dinamik.forEach(function(d){
      var hedef = d === 0 ? 10 : d;
      if (!oklar.some(function(o){ return o[0] === p && o[1] === hedef; })) oklar.push([p, hedef]);
    });
    h.oklar = oklar;
    h.aktif = [];
    for (var q = 1; q <= 10; q++) if (h.pent.noktalar[q].dinamikVar) h.aktif.push(q);
    h.yuksekDuyarlilik = [8, 9, 10, 1].every(function(x){ return h.pent.noktalar[x].dinamikVar; });
    return h;
  }

  /* ---------- Zaman: Üçlü, geçmiş yaşam, kişisel yıl ---------- */
  function uclu(baslangic, adet){
    var sonuc = [], s = baslangic;
    for (var i = 0; i < (adet || 3); i++){
      var a1 = s + (s % 10), a2 = a1 + (Math.floor(s / 10) % 10), a3 = a2 + rakamToplami(s);
      sonuc.push([s, a1, a2, a3]);
      s = a3;
    }
    return sonuc;
  }
  function gecmisYasam(g, a, y){
    var yy = +String(+y).slice(-2);
    var gorev = (+g) + (+a) + yy, yol = nAsal(+g), hedef = gorev + yol;
    return {gorev:gorev, yol:yol, gun:+g, hedef:hedef, hedefSira:asalSirasi(hedef)};
  }
  function kisiselYil(g, a, Y){
    var t = tarihParcalari(g, a, Y);
    var tit = titresim(t.tum);
    return {yil:Y, gun:+g, ay:+a, yy:+t.yy, titresim:tit};
  }
  function gunSayisi(tarih){
    var t = tarihParcalari(tarih.getDate(), tarih.getMonth() + 1, tarih.getFullYear());
    return {yazi:t.yazi, titresim:titresim(t.tum)};
  }
  function yas(g, a, y, bugun){
    var n = bugun.getFullYear() - y;
    if ((bugun.getMonth() + 1) < a || ((bugun.getMonth() + 1) === a && bugun.getDate() < g)) n--;
    return n;
  }

  /* ---------- İsim: harfler asal sayıdır ---------- */
  function harfNormal(c){ return TR_HARF[c] || c; }
  function isimAnalizi(metin){
    var kelimeler = metin.trim().split(/\s+/).filter(Boolean);
    var adlar = [];
    kelimeler.forEach(function(k){
      var harfler = [];
      k.toLocaleUpperCase('tr-TR').split('').forEach(function(c){
        var l = harfNormal(c);
        if (HARFLER[l]) harfler.push({harf:c, latin:l, deger:HARFLER[l]});
      });
      if (!harfler.length) return;
      var gorev = harfler.reduce(function(s, h){ return s + h.deger; }, 0);
      var yol = nAsal(gorev);
      adlar.push({ad:k, harfler:harfler, gorev:gorev, gorevSira:asalSirasi(gorev), yol:yol, hedef:gorev + yol});
    });
    var toplam = null;
    if (adlar.length > 1){
      var g = adlar.reduce(function(s, x){ return s + x.gorev; }, 0), yl = nAsal(g);
      toplam = {gorev:g, gorevSira:asalSirasi(g), yol:yl, hedef:g + yl};
    }
    return {adlar:adlar, toplam:toplam};
  }

  /* ---------- İlişki hesabı ---------- */
  function iliski(A, B){
    var tA = tarihParcalari(A.g, A.a, A.y), tB = tarihParcalari(B.g, B.a, B.y);
    var titA = titresim(tA.tum), titB = titresim(tB.tum);
    function liste(tit, yil){
      var l = [{ara:tit.ara, yil:null}];
      tit.ekler.forEach(function(e){ l.push({ara:e.ara, yil:yil + e.ara}); });
      return l;
    }
    var la = liste(titA, +A.y), lb = liste(titB, +B.y);
    var olaylar = [];
    la.slice(1).forEach(function(x){ olaylar.push({yil:x.yil, kim:'A', ara:x.ara}); });
    lb.slice(1).forEach(function(x){ olaylar.push({yil:x.yil, kim:'B', ara:x.ara}); });
    olaylar.sort(function(p, q){ return p.yil - q.yil; });
    var aktA = la[0].ara, aktB = lb[0].ara, donemler = [{baslangic:null, ara:aktA + aktB, a:aktA, b:aktB}];
    olaylar.forEach(function(o){
      if (o.kim === 'A') aktA = o.ara; else aktB = o.ara;
      var son = donemler[donemler.length - 1];
      if (son.baslangic === o.yil){ son.ara = aktA + aktB; son.a = aktA; son.b = aktB; }
      else donemler.push({baslangic:o.yil, ara:aktA + aktB, a:aktA, b:aktB});
    });
    return {
      gun:(+A.g) + (+B.g), ay:(+A.a) + (+B.a), yil:(+tA.yy) + (+tB.yy),
      A:{tarih:tA, titresim:titA}, B:{tarih:tB, titresim:titB}, donemler:donemler
    };
  }

  /* ---------- Sayı çözümleme (8 adım + 2 ek yol) ---------- */
  function cozumle(n){
    var r = {sayi:n, tanim:SOZLUK[n] || null};
    r.asal = asalMi(n);
    r.asalSira = asalSirasi(n);
    r.carpanlar = [];
    for (var a = 2; a * a <= n; a++) if (n % a === 0) r.carpanlar.push([a, n / a]);
    r.kare = null;
    r.carpanlar.forEach(function(c){ if (c[0] === c[1]) r.kare = c[0]; });
    var asalCarpanlar = [];
    if (r.asal && n > 1) asalCarpanlar.push(n);
    r.carpanlar.forEach(function(c){ c.forEach(function(x){ if (asalMi(x) && x > 1 && asalCarpanlar.indexOf(x) < 0) asalCarpanlar.push(x); }); });
    asalCarpanlar.sort(function(p, q){ return p - q; });
    r.zincirler = asalCarpanlar.map(function(p){
      var z = asalZinciri(p), toplam = null;
      if (z.length >= 2) toplam = z.reduce(function(s, h){ return s + h[0]; }, 0) + z[z.length - 1][1];
      return {asal:p, zincir:z, toplam:toplam};
    });
    r.siraAsal = [];
    for (var i = 0; i < ASALLAR.length && ASALLAR[i] < n; i++){ if (ASALLAR[i] + (i + 1) === n) r.siraAsal.push([i + 1, ASALLAR[i]]); }
    r.ileri = r.asal ? n + r.asalSira : null;
    r.ustOktav = n <= 5000 ? nAsal(n) : null;
    var rt = [n], x = n;
    while (x > 10){ x = rakamToplami(x); rt.push(x); }
    r.rakamToplami = rt;
    var s = String(n);
    r.dizilim = s.length === 2 ? {sol:+s[0], sag:+s[1]} : null;
    r.kesimler = [];
    if (s.length >= 3) for (var k = 1; k < s.length; k++) r.kesimler.push([s.slice(0, k), s.slice(k)]);
    var ters = s.split('').reverse().join('');
    r.ipuclari = {
      ters: s.length >= 2 ? (ters === s ? 'ayni' : (ters[0] !== '0' ? +ters : null)) : null,
      ustat: n >= 11 && n % 11 === 0,
      sonuSifir: n >= 10 && n % 10 === 0,
      dort: s.indexOf('4') >= 0
    };
    var kk = Math.round((Math.sqrt(8 * n + 1) - 1) / 2);
    r.okultKok = (kk * (kk + 1) / 2 === n) ? kk : null;
    return r;
  }

  return {
    SOZLUK:SOZLUK, ARKETIPLER:ARKETIPLER, VUCUT_NOKTALARI:VUCUT_NOKTALARI, HARFLER:HARFLER,
    noktaAdi:noktaAdi, asalSirasi:asalSirasi, nAsal:nAsal, asalZinciri:asalZinciri,
    indirge:indirge, titresim:titresim, pentagram:pentagram, tarihParcalari:tarihParcalari,
    dogum:dogum, golge:golge, vucut:vucut, uclu:uclu, gecmisYasam:gecmisYasam,
    kisiselYil:kisiselYil, gunSayisi:gunSayisi, yas:yas, isimAnalizi:isimAnalizi,
    iliski:iliski, cozumle:cozumle
  };
})();
if (typeof module !== 'undefined') module.exports = PENTAGRAM;
</script>

<script>
(function(){
  var P = PENTAGRAM;
  var $ = function(id){ return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';

  /* Tıklanınca Sayı Çözümleyici'de açılan sayı + varsa sunumdaki tanımı */
  function sayi(n, tanimsiz){

      (!tanimsiz && t ? ' <span class="def">' + esc(t) + '</span>' : '');
  }
  function araMetni(t){ return t.zincir.join(' / '); }

  /* ================= PENTAGRAM ÇİZİMİ ================= */
  var GEN = 720, CX = 360, CY = 352, R = 225;
  var ORAN = {
    1:[0,-1], 3:[-0.951,-0.309], 5:[-0.588,0.809], 7:[0.588,0.809], 9:[0.951,-0.309],
    2:[-0.45,-0.636], 10:[0.45,-0.636], 4:[-0.645,0.11], 8:[0.645,0.11], 6:[0,0.444]
  };
  function konum(p){
    var o = ORAN[p], u = Math.sqrt(o[0] * o[0] + o[1] * o[1]);

  function el(tag, attrs, parent){

  }
  function cizim(h, baslik){

    if (gorunum.seviye) pent.seviyeler.forEach(function(v){

      el('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, 'class':'axis'}, svg);
    });

      var k = konum(p), nk = pent.noktalar[p];

      el('text', {x:k.x, y:k.y + 0.5, 'class':'ptno' + (nk.dolu ? ' dolu' : '')}, svg).textContent = p;
      etiket(svg, p, nk, k);
    }
    return svg;
  }
  function etiket(svg, p, nk, k){
    var parcalar = [];
    if (nk.statikVar) parcalar.push({txt: nk.statik.join(' '), cls:'t-st'});
    else if (gorunum.eksik && nk.dinamikVar) parcalar.push({txt: nk.eksikStatik, cls:'t-ek', halka:'c-ek'});
    if (nk.dinamikVar) parcalar.push({txt: nk.dinamik.join(' '), cls:'t-dy', halka:'c-dy'});
    else if (gorunum.eksik && nk.statikVar) parcalar.push({txt: nk.eksikDinamik, cls:'t-ek', halka:'c-ek'});
    if (!parcalar.length) return;
    var bosluk = 12, toplam = 0;
    parcalar.forEach(function(q){
      var fs = q.cls === 't-ek' ? 30 : 34;
      q.w = q.txt.length * fs * 0.6 + (q.halka ? 18 : 0);
      toplam += q.w;
    });
    toplam += bosluk * (parcalar.length - 1);
    var uzak = (p % 2) ? 48 : 46;
    var ax = k.x + k.ux * uzak, ay = k.y + k.uy * uzak;
    if (p === 1) ay -= 4;
    if (p === 5 || p === 7) ay += 8;
    var kayma = toplam / 2 * Math.abs(k.ux) * 0.9;
    ax += k.ux >= 0 ? kayma : -kayma;
    var x = Math.max(6, Math.min(GEN - 6 - toplam, ax - toplam / 2));
    parcalar.forEach(function(q){
      var cx = x + q.w / 2;

        var hw = q.w / 2, hh = 23;

  }

  /* ================= VÜCUT RESMİ ÇİZİMİ ================= */
  var BK = {1:[427,150],2:[475,99],3:[522,150],10:[436,222],4:[513,222],9:[430,330],5:[519,330],8:[433,452],6:[516,452],7:[474,716]};
  var BSOL = {1:1,10:1,9:1,8:1};
  var BKISA = {1:'Başın arkası',2:'Taç çakra',3:'Alın (3. göz)',4:'Boğaz',5:'Solar pleksus',6:'Cinsel merkez',7:'Ayaklar, bacaklar',8:'Bel (koksiks)',9:'Orta sırt',10:'Boyun'};
  function vucutCizim(v){
    var svg = el('svg', {viewBox:'0 40 960 720', role:'img', 'aria-label':'Vücut resmi'});
    var defs = el('defs', {}, svg), m = el('marker', {id:'okucu', viewBox:'0 0 10 10', refX:'8', refY:'5', markerWidth:'5', markerHeight:'5', orient:'auto-start-reverse'}, defs);
    el('path', {d:'M0,0 L10,5 L0,10 z', 'class':'arrowhead'}, m);
    el('circle', {cx:474, cy:130, r:64, 'class':'spine'}, svg);
    el('line', {x1:474, y1:194, x2:474, y2:690, 'class':'spine'}, svg);
    v.oklar.forEach(function(o, i){
      var a = BK[o[0]], b = BK[o[1]];
      var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy) || 1;
      var bulge = Math.min(190, 60 + L * 0.35) * (i % 2 ? -1 : 1);
      var cx = (a[0] + b[0]) / 2 + (-dy / L) * bulge, cy = (a[1] + b[1]) / 2 + (dx / L) * bulge;
      var ex = b[0] - cx, ey = b[1] - cy, eL = Math.sqrt(ex * ex + ey * ey) || 1;
      var sx = a[0] + (cx - a[0]) / (Math.sqrt((cx - a[0]) * (cx - a[0]) + (cy - a[1]) * (cy - a[1])) || 1) * 28;
      var sy = a[1] + (cy - a[1]) / (Math.sqrt((cx - a[0]) * (cx - a[0]) + (cy - a[1]) * (cy - a[1])) || 1) * 28;
      el('path', {d:'M' + sx.toFixed(1) + ',' + sy.toFixed(1) + ' Q' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' ' + (b[0] - ex / eL * 30).toFixed(1) + ',' + (b[1] - ey / eL * 30).toFixed(1), 'class':'arrow', 'marker-end':'url(#okucu)'}, svg);
    });
    for (var p = 1; p <= 10; p++){
      var k = BK[p], nk = v.pent.noktalar[p], on = nk.dinamikVar, sol = !!BSOL[p];

      el('text', {x:k[0], y:k[1] + 1, 'class':'bno' + (on ? ' on' : '')}, svg).textContent = p;
      var bx = sol ? 395 : 565, lx = sol ? 295 : 662;
      if (on){
        var txt = nk.dinamik.join(' '), w = txt.length * 21 + 28;
        var rx = sol ? bx - w : bx;
        if (sol) lx = Math.min(lx, rx - 14); else lx = Math.max(lx, rx + w + 14);
        el('rect', {x:rx, y:k[1] - 21, width:w, height:42, rx:21, ry:21, 'class':'c-dy'}, svg);

      }

  /* ================= ORTAK KARTLAR ================= */
  function okumaYollari(n){

  function titresimKutulari(t, etiket){

  /* Doğum ve Gölge pentagramı için ortak derin okuma (Bölüm 1.4 – 1.10) */

    for (var i = 1; i <= 10; i++){
      var n = N[i], durum;
      if (!n.dolu) durum = '<span class="muted">Boş — açılmamış hediye ya da ek zorluk</span>';

      '<div class="tbl-wrap"><table><thead><tr><th>Nokta</th><th>Statik</th><th>Dinamik</th><th>Durum</th><th>Tam sayı</th></tr></thead><tbody>' + rows + '</tbody></table></div>');

    html += bolum('1.5', onEk + 'Eksenler', 'Eksen, çözülmesi gereken bir paradokstur. Önce eksik uç tamamlanır, sonra iki tam sayı toplanır: toplam eksenin teması ve amacıdır. Bütün eksenler ortada — kalpte — buluşur.',
      '<div class="cards">' + h.pent.eksenler.map(function(o){ return kart(o, {tur:true, etiket:'Eksenin teması', parcaTanim:true}); }).join('') + '</div>' +
      '<div class="note">' + (eksenSay === 0 ? '🌍 Hiç eksen yok: kişilik gelişimi ağırlıkla dış dünya ile temas yoluyla — hayatta karşılaşılan durumlar ve insanlar üzerinden — ilerler.' : '🧭 ' + eksenSay + ' eksen var. Eksen ne kadar çoksa, kişinin iç meselelerle uğraşma düzeyi o kadar artar.') + '</div>');
    html += bolum('1.6', onEk + 'Farkındalık seviyeleri', 'Seviye ancak her iki ucunda da sayı varsa oluşur. İki taraftaki tam sayılar seviyenin eril ve dişil itici güçleridir; toplamları seviyenin hedefini açıklar.',
      '<div class="cards">' + h.pent.seviyeler.map(function(o){ return kart(o, {tur:true, etiket:'Seviyenin hedefi', parcaTanim:true}); }).join('') + '</div>');
    html += bolum('1.7', onEk + 'Üçgenler', 'Bir seviye 1. ilke ("Tanrı" alemi: ilham, coşku, neşe) ya da 6. ilke ("Ego" alemi: güç, azim, tutku) ile bağlandığında üçgen oluşur. Üçgen yeteneklere dair ipucu verir; doğru ele alınmazsa tuzağını gösterir.',
      '<div class="cards">' + h.pent.ucgenler.map(function(o){ return kart(o, {etiket:'Üçgenin enerjisi'}); }).join('') + '</div>');
    html += bolum('1.8', onEk + 'Kadranlar (dörtgenler)', 'İki seviye iki eksenle bağlandığında kadran oluşur; bu yalnızca iki durumda olur. Köşelerdeki sayılar bireysel temaları, dört köşenin toplamı genel temayı verir.',
      '<div class="cards">' + h.pent.kadranlar.map(function(o){ return kart(o, {etiket:'Dörtgenin değeri'}); }).join('') + '</div>');
    html += bolum('1.9', onEk + 'Beşgenler', 'Tüm dış noktalar (1-3-5-7-9) ya da tüm iç noktalar (2-4-6-8-0) dolduğunda beşgen oluşur; üçgen ve kadranlardan daha nadirdir.',
      '<div class="cards">' + h.pent.besgenler.map(function(o){ return kart(o, {etiket:o.etiket}); }).join('') + '</div>');
    html += bolum('1.10', onEk + 'Trikolonlar (üçlü sütunlar)', 'Üç konum da pentagramda bir sayı taşıdığında ilgili trikolon enerjisi aktive olur.',
      '<div class="cards">' + h.pent.trikolonlar.map(function(o){ return kart(o, {etiket:'Değeri'}); }).join('') + '</div>');

  /* ================= SEKMELER ================= */
  function sekmeDogum(isim, h){
    var s = h.titresim, N = h.pent.noktalar;
    var kv = titresimKutulari(s, 'Ruhsal titreşim (Ara / Çekirdek)');
    kv += '<div class="kv"><div class="k">Ara sayı yaşı</div><div class="v">' + h.araYasi + '</div><div class="s">' + h.araYili + ' yılı: hayatın kontrolünü ele alma</div></div>';
    var ekler = s.ekler.length ? '<div class="note">🔄 <b>Sıfır kuralı — Dönüşüm tipi:</b> tarihte ' + s.sifirSayisi + ' sıfır var; her sıfır için ara tipe 10 eklenir: ' + s.ekler.map(function(e){ return '<b>' + e.zincir.join(' / ') + '</b>'; }).join(' · ') + '.</div>' : '';
    var info = '<p class="person">' + esc(isim) + '</p><p class="date-big">' + h.tarih.yazi + '</p><div class="kv-grid">' + kv + '</div>' + ekler +
      '<div class="note">💡 Pentagrama yazılan rakamlar: <b>' + h.tarih.pent.join(' – ') + '</b>. Yüzyıl rakamları (' + esc(h.tarih.yuzyil) + ') titreşim hesabına girer, pentagrama yazılmaz; kolektif mirası temsil eder.' +
      '<br>🎭 Ara sayı ' + sayi(s.ara, true) + ' "sahne"dir (dış dünyanın sizi algılayışı); çekirdek sayı ' + sayi(s.cekirdek, true) + ' "oyuncu"dur (öz enerji, bu yaşamdaki ana görev).' +
      (h.araUsta ? '<br>🛠️ ' + s.ara + ' → 6: ' + esc(h.araUsta) + ' üzerinden gelen ustalık.' : '') + '</div>';
    var html = '<section class="mod"><div class="hero"><div>' + svgKutu('svgDogum') + '</div><div>' + info + '</div></div></section>';

    /* Okuma sırası 1: doğum günü sayıları */
    var dg = '<div class="tbl-wrap"><table><tbody>' +
      '<tr><td><b>👤 Persona (gün)</b><br><span class="muted">Kendinizi gösterme biçiminiz</span></td><td>' + sayi(h.persona) + '</td></tr>' +
      '<tr><td><b>💗 Ruh (ay)</b><br><span class="muted">Duygular, sosyal ilişkiler</span></td><td>' + sayi(h.ruh) + '</td></tr>' +
      '<tr><td><b>🌍 Fiziksel (yıl, yüzyılsız)</b><br><span class="muted">Beden ve maddi dünya</span></td><td>' + sayi(h.fiziksel) + '</td></tr>' +
      '<tr><td><b>🧠 Düşünme ve hissetme (gün + ay)</b><br><span class="muted">Kalp ile zihnin buluşması</span></td><td>' + h.persona + ' + ' + h.ruh + ' = ' + sayi(h.dusunme) + '</td></tr>' +
      '<tr><td><b>⚡ Davranış ve tepki (ay + yıl)</b><br><span class="muted">Derin düşünmeden, otomatik tepkiler</span></td><td>' + h.ruh + ' + ' + h.fiziksel + ' = ' + sayi(h.tepki) + '</td></tr>' +
      '</tbody></table></div>';
    html += bolum('OKUMA 1', 'Doğum tarihinin sayıları', 'Okuma, doğum tarihi sayılarının açıklamalarıyla başlar.', dg);

    /* Okuma sırası 2–4 */
    var ciftler = [], coklu = [], dolu = [], bos = [];
    for (var p = 1; p <= 10; p++){
      var n = N[p];
      if (n.statikVar && n.dinamikVar) ciftler.push(p);
      if (n.statik.length > 1) coklu.push('<li>🔁 ' + p + '. noktada statik <span class="st">' + n.statik.join(' ') + '</span> — ' + n.statik.length + ' kez ' + n.statik[0] + '</li>');
      if (n.dinamik.length > 1) coklu.push('<li>🔁 ' + p + '. noktada dinamik <span class="dy">' + n.dinamik.join(' ') + '</span> — ' + n.dinamik.length + ' kez ' + n.dinamik[0] + '</li>');
      (n.statikVar ? dolu : bos).push(p);
    }
    var tek = 0, cift = 0, eril = 0, disil = 0, alti = 0;
    h.tarih.pent.forEach(function(d){
      var v = d === 0 ? 10 : d;
      if (d % 2) tek++; else cift++;
      if (v <= 5) eril++; else if (v === 6) alti++; else disil++;
    });
    var ic = '<h3 class="sub">2 · Statik-dinamik çift sayılar <span class="muted">(en önemlileri)</span></h3>' +
      (ciftler.length ? '<ul class="bul">' + ciftler.map(function(p){ return '<li>⭐ ' + p + '. nokta: <span class="st">' + N[p].statik.join(' ') + '</span> + <span class="dy">' + N[p].dinamik.join(' ') + '</span> → ' + sayi(N[p].tam) + '</li>'; }).join('') + '</ul>' : '<p class="muted">Hiçbir noktada statik ve dinamik sayı birlikte yok.</p>') +
      '<h3 class="sub">3 · Çoklu sayılar</h3>' + (coklu.length ? '<ul class="bul">' + coklu.join('') + '</ul><p class="muted">Aynı ilkenin tekrarı, o enerjinin etkisini katlar.</p>' : '<p class="muted">Tekrarlanan sayı yok.</p>') +
      '<h3 class="sub">4 · Tek tek noktalar</h3><ul class="bul">' +
      '<li>🟡 Statik dolu noktalar (' + dolu.length + '): <b>' + dolu.join(', ') + '</b> — dünyaya birlikte getirdiğiniz yetenek ve potansiyeller; hayatı yaşamak için araç kutunuz.</li>' +
      '<li>⚪ Statik boş noktalar (' + bos.length + '): <b>' + (bos.join(', ') || '—') + '</b> — ya henüz "açılmamış hediyeler" ya da ek zorluklar; soru olarak not edilir. Boşluk normaldir.</li>' +
      '<li>☀️ Statik rakamlar: ' + tek + ' tek (yayan, dışa dönük) · ' + cift + ' çift (alıcı, içe dönük).</li>' +
      '<li>⚧️ Statik rakamlar: ' + eril + ' eril (1–5) · ' + disil + ' dişil (7–10)' + (alti ? ' · ' + alti + ' kez 6 (temel güç, Devrim)' : '') + '.</li></ul>';
    html += bolum('OKUMA 2–4', 'Çift sayılar, çoklu sayılar ve noktalar', '', ic);
    html += derinOkuma(h, '');
    html += '<div class="note">📘 Gösterim: parantez içindeki rakam eksik eştir — <b>1(5)</b> statik 1 var, dinamik 5 eksik; <b>(6)4</b> statik 6 eksik, dinamik 4 var. Asal sıralaması bu sistemde 1\'den başlar (1, 2, 3, 5, 7 …). Hangi pentagramı çizerseniz çizin, on noktanın tam sayılarının toplamı her zaman ' + sayi(595, true) + ' çıkar. Sayıya tıklayınca Sayı Çözümleyici açılır.</div>';
    return html;
  }

  function sekmeGolge(h){
    var s = h.titresim, t = h.tarih;
    var kv = titresimKutulari(s, 'Gölge titreşim (Ara / Çekirdek)');
    var info = '<p class="person">Gölge Pentagram</p><p class="date-big">' + durum.dogum.tarih.yazi + ' → ' + t.yazi + '</p><div class="kv-grid">' + kv + '</div>' +
      '<div class="note">🔄 Eksendeki sayının zıttı gölge sayıdır (+5 kuralı): 1↔6 · 2↔7 · 3↔8 · 4↔9 · 5↔0. Doğum tarihinin tüm rakamları — yüzyıl dahil — dönüştürülür ve toplanır. Pentagrama yazılan rakamlar: <b>' + t.pent.join(' – ') + '</b>; gölge yüzyıl rakamları (' + esc(t.yuzyil) + ') pentagrama girmez.</div>' +
      '<div class="note">🌗 Buradaki temalar kişinin "farkında olmadığı" şeylerdir; kişi sinirlendiğinde, kızdığında veya köşeye sıkıştığında ortaya çıkabilir. Gölge, kendimizdeki karşı cinsi de temsil eder. İlişkilerde çoğu zaman bir partnerin ışık pentagramı, diğerinin gölge pentagramıdır.</div>';
    var html = '<section class="mod"><div class="hero"><div>' + svgKutu('svgGolge') + '</div><div>' + info + '</div></div></section>';
    html += derinOkuma(h, 'Gölge · ');
    return html;
  }

  function sekmeVucut(v){
    var VN = P.VUCUT_NOKTALARI, s = v.titresim;
    var kv = '<div class="kv"><div class="k">Fiziksel titreşim</div><div class="v">' + araMetni(s) + '</div>' + (s.cekirdek === 11 ? '<div class="s">Sayma için 1 + 1 = 2 alınır</div>' : '') + '</div>' +
      '<div class="kv gold"><div class="k">Aktive noktalar</div><div class="v">' + (v.aktif.join(' · ') || '—') + '</div></div>';
    var info = '<p class="person">Vücut Resmi</p><p class="date-big">' + durum.dogum.tarih.yazi + ' → ' + v.tarih.yazi + '</p><div class="kv-grid">' + kv + '</div>' +
      '<div class="note">🧍 Ruhani üçgen 2-1-0, hayati üçgen 5-6-7\'nin üzerine katlanır: <b>2 → 5 · 1 → 6 · 0 → 7</b>. Tüm rakamlar — yüzyıl ve binler dahil — dönüştürülür; toplamı fiziksel titreşimi verir. Dönüştürülen rakamlar (' + v.tarih.pent.join(' – ') + ') pentagramdaki dinamik tur gibi, çekirdek sayıdan (' + s.sayim + ') sayılarak yerleştirilir. Ruhsal titreşim (' + araMetni(durum.dogum.titresim) + ') pentagramın, fiziksel titreşim vücut resminin okunmasını yönetir.</div>' +
      '<div class="note">👁️ Noktaların içinde duran bir kişinin sol tarafına baktığınızı hayal edin: solda sırt, sağda ön taraf. Kırmızı ok, enerji yaşanmazsa rahatsızlığın çıkabileceği noktayı gösterir.</div>';
    var html = '<section class="mod"><div class="hero"><div><div class="svg-box" id="svgVucut"></div></div><div>' + info + '</div></div></section>';
    var kartlar = v.aktif.map(function(p){
      var d = VN[p], nk = v.pent.noktalar[p];
      var c = '<div class="card"><h3>' + p + ' · ' + esc(d.yer) + ' — ' + esc(d.tema) + '</h3>';
      c += '<div class="desc">Bu noktada dinamik <span class="dy">' + nk.dinamik.join(' ') + '</span> var' + (nk.dinamik.length > 1 ? ' (' + nk.dinamik.length + ' kat doz)' : '') + '. ' + p + '\'nin arkasındaki ' + nk.dinamik[0] + ' ayrıca ' + sayi(p * 10 + (nk.dinamik[0] % 10)) + ' okunur.</div>';
      c += '<div class="desc">' + esc(d.metin) + '</div>';
      if (d.olumlu) c += '<div class="desc">✅ <b>Olumlu:</b> ' + esc(d.olumlu) + '</div>';
      if (d.olumsuz) c += '<div class="desc">⚠️ <b>Olumsuz:</b> ' + esc(d.olumsuz) + '</div>';
      v.oklar.filter(function(o){ return o[0] === p; }).forEach(function(o){
        var hd = VN[o[1]];
        c += '<div class="warn">➡️ <b>Bu enerji yaşanmazsa ' + o[1] + '. nokta (' + esc(hd.yer) + ') bloke olur:</b> ' + esc(hd.olumsuz || hd.metin) + '</div>';
      });
      return c + '</div>';
    }).join('');
    html += bolum('', 'Aktive noktalar', 'Bunlar her gün bize kozmik enerji sağlayan ince beden üzerindeki noktalardır; her gün yaşanmalı ve ifade edilmelidir. Kullanılmazlarsa bedenin başka bir bölümüne müdahale eder ve somatik belirtileri tetikleyebilirler.', v.aktif.length ? '<div class="cards">' + kartlar + '</div>' : '<p class="muted">Aktive nokta yok.</p>');
    var zincir = v.oklar.map(function(o){ return o[0] + ' → ' + o[1]; }).join(' · ');
    var notlar = '<ul class="bul"><li>🔗 <b>Etki zinciri:</b> ' + (zincir || '—') + '. Bir noktada hissedilen ağrı, ok veren noktadaki tıkanıklıktan ya da zincirdeki önceki noktalardan kaynaklanabilir.</li>';
    if (v.yuksekDuyarlilik) notlar += '<li>🌊 <b>Yüksek duyarlılık:</b> 8, 9, 10 ve 1 numaralı noktalar aktif; kişi fiziksel olmayan enerjilere oldukça duyarlıdır. Öneri: doğaya veya denize yakın yaşamak, mümkün olduğunca çok zaman ayırmak ve arkadaş seçiminde çok dikkatli olmak.</li>';
    notlar += '</ul><div class="note">⚕️ Numerolojik yorum çerçevesidir; tıbbi tanı yerine geçmez.</div>';
    html += bolum('', 'Zincir ve uyarılar', '', notlar);
    var tum = '';
    for (var p = 1; p <= 10; p++){ var d = VN[p]; tum += '<tr><td class="num">' + p + '</td><td><b>' + esc(d.yer) + '</b><br><span class="muted">' + esc(d.tema) + '</span></td><td>' + esc(d.metin) + '</td></tr>'; }
    html += bolum('', 'On enerjik nokta', '', '<div class="tbl-wrap"><table><thead><tr><th>Nokta</th><th>Yer · Tema</th><th>Açıklama</th></tr></thead><tbody>' + tum + '</tbody></table></div>');
    return html;
  }

  function sekmeZaman(h){
    var bugun = new Date(), g = h.tarih.gun, a = h.tarih.ay, y = +h.tarih.yil;
    var yas = P.yas(+g, +a, y, bugun), html = '';
    var u = P.uclu(h.titresim.ara), adlar = [['1','Yetenek — "neden"','"Ekim" aşaması: yeni bir başlangıç, yeniden başlarsınız.'],['2','İzin — "değişim"','Daha önce ekilenlerin sonuçlarını görür, düzeltmek için müdahale edebilirsiniz.'],['3','İhtiyaç — "sonuç"','Ektiğiniz ve düzelttiğiniz şeylerin hasat aşaması.']];
    var ur = u.map(function(x, i){
      return '<div class="card"><h3>' + adlar[i][0] + ' · ' + adlar[i][1] + '</h3><div class="formula">' + x[0] + ' → ' + x[1] + ' → ' + x[2] + ' → <span class="sum">' + x[3] + '</span></div><div class="desc">📆 ' + (y + x[0]) + ' – ' + (y + x[3]) + ' · ' + adlar[i][2] + '</div></div>';
    }).join('');
    html += bolum('', '⏳ Zaman gözlemi: Üçlü', 'Ara tip yaşına (' + h.titresim.ara + ') ulaşıldığında yeniden başlanır ve hayat üç aşamada ilerler. Adımlar: başlangıç + birler basamağı → sonuç + onlar basamağı → sonuç + başlangıcın rakamları toplamı. Her üçlünün son yaşı bir sonrakinin başlangıcıdır. Bir aşamadaki üç adım yetenek, izin ve yükümlülük olarak da ayrılabilir.',
      '<div class="cards">' + ur + '</div>' +
      '<div class="note">🕊️ Altın renkli yaşlar (' + u.map(function(x){ return x[3]; }).join(', ') + ') "özgürlük yılı"dır: uzun süredir çözülmüş durum ve ilişkilerden kurtulma şansı çok yüksektir — bu "rüzgârı" kullanın. Üç aşama tamamlandığında (' + u[2][3] + ' yaş) "aptalın özgürlüğü" başlar: artık hiçbir ilkeye bağlı değilsinizdir.</div>');

    var gy = P.gecmisYasam(+g, +a, y);
    html += bolum('', '🌞 Geçmiş yaşam: Görev – Yol – Hedef', 'Fritz Guggisberg\'in yöntemi. Görev: gün + ay + yıl (yüzyılsız) = Güneş sayısı. Yol: doğum günü sayısının asal sıralaması. Hedef: Görev + Yol.',
      '<ul class="bul"><li>🎯 <b>Görev (Güneş sayısı):</b> ' + (+g) + ' + ' + (+a) + ' + ' + (+h.tarih.yy) + ' = ' + sayi(gy.gorev) + '</li>' +
      '<li>🛤️ <b>Yol:</b> ' + gy.gun + '. asal = ' + sayi(gy.yol) + '</li>' +
      '<li>🏁 <b>Hedef:</b> ' + gy.gorev + ' + ' + gy.yol + ' = ' + sayi(gy.hedef) + (gy.hedefSira ? ' · ' + gy.hedefSira + '. asal ' + sayi(gy.hedefSira) : '') + '</li></ul>');

    var yilSec = '<label class="muted">Yıl: <select id="kyYil" style="max-width:140px;display:inline-block">';
    for (var Y = bugun.getFullYear() - 10; Y <= bugun.getFullYear() + 10; Y++) yilSec += '<option' + (Y === bugun.getFullYear() ? ' selected' : '') + '>' + Y + '</option>';
    yilSec += '</select></label><div id="kyIcerik"></div>';
    html += bolum('', '📅 Kişisel yıl', 'Doğum yılı, bakmak istediğiniz yılla değiştirilir; gün ve ay aynı kalır ve titreşim hesabı tekrarlanır.', yilSec);

    var gs = P.gunSayisi(bugun);
    html += bolum('', '🎂 Yaşınızın sayısı ve günün sayısı', '',
      '<ul class="bul"><li>🎂 <b>Yaş:</b> ' + sayi(yas) + ' <span class="muted">— içinde bulunduğunuz yılın ana temalarını ve genel fikrini verir; her doğum gününde yeni bir sayıya geçersiniz.</span></li>' +
      '<li>☀️ <b>Bugün (' + gs.yazi + '):</b> ' + araMetni(gs.titresim) + ' → ' + sayi(gs.titresim.ara) + ' · ' + sayi(gs.titresim.cekirdek) + '</li></ul>');
    return html;
  }
  function kisiselYilCiz(){

  function sekmeIsim(isim){
    var r = P.isimAnalizi(isim);
    if (!r.adlar.length) return bolum('', '🔤 İsim analizi', '', '<p class="muted">İsimde harf bulunamadı.</p>');
    var html = '';
    var harfTablo = '<div class="harf-grid">' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function(c){ return '<div><b>' + c + '</b><span class="muted">' + P.HARFLER[c] + '</span></div>'; }).join('') + '</div>';
    var kartlar = r.adlar.map(function(a){
      return '<div class="card"><h3>' + esc(a.ad) + '</h3><div class="desc">' + a.harfler.map(function(x){ return '<b>' + esc(x.harf) + '</b> ' + x.deger; }).join(' + ') + '</div>' +
        '<ul class="readings"><li>🎯 <b>Görev:</b> ' + sayi(a.gorev) + (a.gorevSira ? ' · ' + a.gorevSira + '. asal' : '') + '</li>' +
        '<li>🛤️ <b>Yol:</b> ' + a.gorev + '. asal = ' + sayi(a.yol) + '</li>' +
        '<li>🏁 <b>Hedef:</b> ' + a.gorev + ' + ' + a.yol + ' = ' + sayi(a.hedef) + '</li></ul></div>';
    }).join('');
    if (r.toplam) kartlar += '<div class="card"><h3>Bütün adlar birlikte</h3><div class="desc">' + r.adlar.map(function(a){ return a.gorev; }).join(' + ') + ' = ' + r.toplam.gorev + '</div>' +
      '<ul class="readings"><li>🎯 <b>Görev:</b> ' + sayi(r.toplam.gorev) + (r.toplam.gorevSira ? ' · ' + r.toplam.gorevSira + '. asal' : '') + '</li>' +
      '<li>🛤️ <b>Yol:</b> ' + r.toplam.gorev + '. asal = ' + sayi(r.toplam.yol) + '</li>' +
      '<li>🏁 <b>Hedef:</b> ' + r.toplam.gorev + ' + ' + r.toplam.yol + ' = ' + sayi(r.toplam.hedef) + '</li></ul></div>';
    html += bolum('', '🔤 İsim analizi', 'Alfabenin 26 harfi, 100\'ün altındaki 26 asal sayıyla birebir örtüşür (1 de asal sayılır). Görev: harflerin toplamı. Yol: görev sayısını sıra kabul edip o sıradaki asal. Hedef: Görev + Yol. Adlar önce tek tek, sonra hep birlikte toplanır. Türkçe harfler Latin karşılığıyla (Ç→C, Ğ→G, İ/I→I, Ö→O, Ş→S, Ü→U) hesaplanır.',
      '<div class="cards">' + kartlar + '</div><div class="note">💡 Sadece kişinin çağrıldığı adları kullanın — nüfustaki bütün adları değil; titreşimi tekrar eden ad yaratır. Doğum tarihi değişmez, ad değişebilir: ad çözümlemesi, tarihin verdiği titreşimi güçlendirip güçlendirmediğini gösterir.</div>' +
      '<h3 class="sub">Harf tablosu</h3>' + harfTablo);
    return html;
  }

  function sekmeIliski(isimA, isimB, il){
    var A = il.A, B = il.B;
    function satir(ad, x){ return '<tr><td><b>' + esc(ad) + '</b></td><td>' + (+x.tarih.gun) + '</td><td>' + (+x.tarih.ay) + '</td><td>(' + esc(x.tarih.yuzyil) + ')' + x.tarih.yy + '</td><td>' + araMetni(x.titresim) + '</td><td>' + (x.titresim.ekler.map(function(e){ return e.zincir.join(' / '); }).join(' · ') || '—') + '</td></tr>'; }
    var tablo = '<div class="tbl-wrap"><table><thead><tr><th></th><th>Gün</th><th>Ay</th><th>Yıl</th><th>Titreşim</th><th>Sıfır kuralı</th></tr></thead><tbody>' +
      satir(isimA, A) + satir(isimB, B) + '<tr><td><b>Çift</b></td><td class="num">' + il.gun + '</td><td class="num">' + il.ay + '</td><td class="num">' + il.yil + '</td><td colspan="2"></td></tr></tbody></table></div>';
    var duzey = '<ul class="bul"><li>👤 <b>Kişisel düzey (gün toplamı):</b> ' + sayi(il.gun) + '</li><li>💗 <b>Ruh düzeyi (ay toplamı):</b> ' + sayi(il.ay) + '</li><li>🌍 <b>Fiziksel düzey (yıl toplamı, yüzyılsız):</b> ' + sayi(il.yil) + '</li></ul>';
    var don = '<ul class="bul">' + il.donemler.map(function(d, i){
      var son = il.donemler[i + 1];
      return '<li>🔢 ' + (d.baslangic ? d.baslangic + '\'den itibaren' : 'Baştan itibaren') + (son ? ' (' + son.baslangic + '\'e kadar)' : '') + ': ' + d.a + ' + ' + d.b + ' = ' + sayi(d.ara) + '</li>';
    }).join('') + '</ul>';
    return bolum('', '💞 İlişki hesabı', 'Partnerin doğum tarihi alt alta yazılıp toplanır. Gün, ay ve yıl toplamlarına ayrı ayrı bakılır; yıl toplamında yüzyıl yer almaz, titreşim sayısında ise yüzyıl eklenir.',
      tablo + '<h3 class="sub">İlişkideki temalar: üç düzey</h3>' + duzey +
      '<h3 class="sub">Ara sayı: dış dünya bu çifti nasıl algılar?</h3><p class="muted">İlişkinin birden fazla ara sayısı olabilir. Birincisi baştan itibaren aktiftir; sıfır kuralından gelen sonraki ara sayı, o sayıya karşılık gelen yaşa ulaşıldığında devreye girer.</p>' + don +
      '<div class="actions no-print"><button type="button" class="btn ghost" id="partnerAc">⭐ ' + esc(isimB) + ' için pentagramı aç</button></div>');
  }

  function sekmeCozumle(){
    return '<section class="mod"><h2>🔍 Sayı Çözümleyici</h2><p class="lead">Tanımı olmayan bir sayıyı kendin nasıl okursun? Sekiz adım, her sayıda aynı sırayla. Araçlar susuyorsa sen de sus: çalışmayan adım boş bırakılır.</p>' +
      '<div class="coz-in"><input type="number" id="cozSayi" min="1" max="99999" placeholder="Sayı" inputmode="numeric"><button type="button" class="btn" id="cozBtn" style="margin:0">Çözümle</button></div><div id="cozSonuc" style="margin-top:16px"></div></section>';
  }
  function cozumCiz(n){
    var c = P.cozumle(n), L = [];
    function adim(baslik, ic, bos, ek){ L.push('<li class="' + (bos ? 'bos ' : '') + (ek ? 'ekyol' : '') + '"><b class="t">' + baslik + '</b>' + ic + '</li>'); }
    adim('Asal mı?', c.asal ? 'Evet — ' + n + ', sırada ' + c.asalSira + '. asaldır; içeriği ' + sayi(c.asalSira) + '.' : 'Hayır — bölünüyor.');
    adim('Çarpanları yaz', c.carpanlar.length ? c.carpanlar.map(function(x){ return '<div>' + x[0] + ' × ' + x[1] + ' → ' + sayi(x[0]) + ' · ' + sayi(x[1]) + '</div>'; }).join('') + '<div class="muted">Her çift ayrı bir cümle verir: küçük sayı büyüğe ne yapıyor?</div>' : 'Çarpan çifti yok.', !c.carpanlar.length);
    adim('Aynı sayı iki kez mi?', c.kare ? n + ' = ' + c.kare + ' × ' + c.kare + (c.kare <= 10 ? ' — kök 0–10 arasında: içerik saftır, yalnızca ' + sayi(c.kare) + '.' : ' — kök 10\'dan büyük: kökü de çözümle (' + sayi(c.kare, true) + ').') : 'Hayır, kare değil.', !c.kare);
    var zl = c.zincirler.filter(function(z){ return z.asal > 3 || z.asal === n; });
    adim('Asal çarpana bak', zl.length ? zl.map(function(z){
      return '<div>' + z.zincir.map(function(h){ return h[0] + ' → ' + h[1] + '. asal'; }).join(' · ') + ' → içerik ' + sayi(z.zincir[z.zincir.length - 1][1]) +
        (z.toplam ? '<br><span class="muted">Zincirin toplamı:</span> ' + z.zincir.map(function(h){ return h[0]; }).concat([z.zincir[z.zincir.length - 1][1]]).join(' + ') + ' = ' + sayi(z.toplam) : '') + '</div>';
    }).join('') : 'İçeriği okunacak asal çarpan yok.', !zl.length);
    adim('Sıra + asal ara', (c.siraAsal.length ? c.siraAsal.map(function(x){ return '<div>' + n + ' = ' + x[0] + ' + ' + x[1] + ' (' + x[1] + ' → ' + x[0] + '. asal) → ' + sayi(x[0]) + ' · ' + sayi(x[1]) + '</div>'; }).join('') : 'Böyle bir çift yok.') +
      (c.ileri ? '<div class="muted">İleri yön: ' + n + ' + ' + c.asalSira + ' = ' + sayi(c.ileri, true) + '</div>' : '') +
      (c.ustOktav ? '<div class="muted">Üst oktav: ' + n + '. sıra = ' + sayi(c.ustOktav, true) + '</div>' : ''), !c.siraAsal.length);
    adim('Rakamları topla', c.rakamToplami.length > 1 ? c.rakamToplami.map(function(x, i){ return i ? sayi(x) : String(x); }).join(' → ') + '<div class="muted">Çıkan sayı çözümdür: parçaların iş birliğinin hedefi. İki adım sürerse aradaki basamak da okunur.</div>' : 'Tek basamaklı — kendisi.');
    var bas = '';
    if (c.dizilim) bas = 'Soldaki ' + sayi(c.dizilim.sol) + ' yerleşmiş, deneyimlenmiş taraftır; sağdaki ' + sayi(c.dizilim.sag) + ' dinamik taraftır ve soldakini kendi lehine değiştirmek ister.' + (c.dizilim.sag === 0 ? ' Sağdaki 0: bir onluk döngü kapanmıştır.' : '');
    else if (c.kesimler.length) bas = c.kesimler.map(function(k){ return '<div><b>' + k[0] + '-' + k[1] + '</b> → ' + sayi(+k[0]) + ' · ' + sayi(+k[1]) + '</div>'; }).join('') + '<div class="muted">"Soldakini kullanarak sağdakini yap."</div>';
    adim('Basamakları oku', bas || 'Tek basamaklı — çalışmaz.', !bas);
    var ip = [];
    if (c.ipuclari.ters === 'ayni') ip.push('🔁 Tersten de ' + n + ': içeriyle dışarı aynı şeyi söylüyor.');
    else if (c.ipuclari.ters && String(n).length === 2) ip.push('🔁 Ters sayı ' + sayi(c.ipuclari.ters, true) + ': aynı malzeme, ters yön.');
    if (c.ipuclari.ustat) ip.push('🌟 11\'in katı — üstat sayı: fikir çoktur ama hep çifttir.');
    if (c.ipuclari.sonuSifir) ip.push('⭕ Sonu 0: bir onluk tur biter; bilinen kapanır, sıfırdan başlanır.');
    if (c.ipuclari.dort) ip.push('🧱 İçinde 4 var: geçmişten gelen yük — madde, sınır, karmik bağlam.');
    if (c.okultKok) ip.push('🪜 Okült kök: 1 + 2 + … + ' + c.okultKok + ' = ' + n + ' → özü ' + sayi(c.okultKok) + '.');
    adim('İpuçları ve ek yollar', (ip.length ? ip.map(function(x){ return '<div>' + x + '</div>'; }).join('') : 'Karşılık veren ipucu yok; zorlanmaz.') + '<div class="muted">Araçlardan sonra bakılır; yalnızca karşılık verenler kullanılır.</div>', !ip.length, true);
    adim('Cümleleri birleştir', 'Tekrarı ele, çelişkiyi gerilim olarak yaz; hepsini tek cümlede topla. Sayı eğilim gösterir, olay bildirmez.');
    $('cozSonuc').innerHTML = '<div class="kv gold" style="margin-bottom:12px"><div class="k">Çözümlenen sayı</div><div class="v">' + n + '</div><div class="s">' + (c.tanim ? 'Hazır tanım: ' + esc(c.tanim) : 'Bu sayı için sunumlarda hazır tanım yok; yorum aşağıdaki yöntemle çıkarılır.') + '</div></div><ol class="steps">' + L.join('') + '</ol>';
  }

  /* ================= ANA AKIŞ ================= */
  var SEKMELER = [];
  function sekmeKur(liste){
    SEKMELER = liste;
    $('tabs').innerHTML = liste.map(function(s, i){ return '<button type="button" class="tab' + (i ? '' : ' on') + '" data-tab="' + s.id + '">' + s.ad + '</button>'; }).join('');
    $('panels').innerHTML = liste.map(function(s, i){ return '<div class="panel" id="panel-' + s.id + '"' + (i ? ' hidden' : '') + '>' + s.html + '</div>'; }).join('');
  }
  function sekmeAc(id){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === id); });
    Array.prototype.forEach.call(document.querySelectorAll('.panel'), function(p){ p.hidden = p.id !== 'panel-' + id; });
  }
  function cizimleriYenile(){
    var b1 = $('svgDogum'), b2 = $('svgGolge'), b3 = $('svgVucut');
    if (b1){ b1.innerHTML = ''; b1.appendChild(cizim(durum.dogum, durum.dogum.tarih.yazi + '   ·   ' + araMetni(durum.dogum.titresim))); }
    if (b2){ b2.innerHTML = ''; b2.appendChild(cizim(durum.golge, durum.golge.tarih.yazi + '   ·   ' + araMetni(durum.golge.titresim))); }
    if (b3){ b3.innerHTML = ''; b3.appendChild(vucutCizim(durum.vucut)); }
  }

  function goster(){
    var g = durum.g, a = durum.a, y = durum.y;
    durum.dogum = P.dogum(g, a, y);
    durum.golge = P.golge(g, a, y);
    durum.vucut = P.vucut(g, a, y);
    var liste = [
      {id:'dogum', ad:'⭐ Doğum Pentagramı', html:sekmeDogum(durum.isim, durum.dogum)},
      {id:'golge', ad:'🌑 Gölge Pentagram', html:sekmeGolge(durum.golge)},
      {id:'vucut', ad:'🧍 Vücut Resmi', html:sekmeVucut(durum.vucut)},
      {id:'zaman', ad:'⏳ Zaman', html:sekmeZaman(durum.dogum)},
      {id:'isim', ad:'🔤 İsim', html:sekmeIsim(durum.isim)}
    ];
    if (durum.partner){
      durum.iliski = P.iliski({g:g, a:a, y:y}, durum.partner);
      liste.push({id:'iliski', ad:'💞 İlişki', html:sekmeIliski(durum.isim, durum.partner.isim, durum.iliski)});
    }
    liste.push({id:'coz', ad:'🔍 Sayı Çözümleyici', html:sekmeCozumle()});
    sekmeKur(liste);
    $('results').hidden = false;
    $('printBtn').hidden = false;
    cizimleriYenile();
    kisiselYilCiz();
    var sel = $('kyYil'); if (sel) sel.addEventListener('change', kisiselYilCiz);
    $('cozBtn').addEventListener('click', function(){ var n = parseInt($('cozSayi').value, 10); if (n >= 1 && n <= 99999) cozumCiz(n); });
    $('cozSayi').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); $('cozBtn').click(); } });
    var pa = $('partnerAc');
    if (pa) pa.addEventListener('click', function(){
      var p = durum.partner;
      $('isim').value = p.isim; $('gun').value = p.g; $('ay').value = p.a; $('yil').value = p.y;
      $('pIsim').value = ''; $('pGun').value = ''; $('pAy').value = ''; $('pYil').value = '';
      $('form').requestSubmit();
    });
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-tab],[data-coz]') : null;
    if (!t) return;
    if (t.hasAttribute('data-tab')) sekmeAc(t.getAttribute('data-tab'));
    else {
      var n = +t.getAttribute('data-coz');
      sekmeAc('coz'); $('cozSayi').value = n; cozumCiz(n);
      $('results').scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
  document.addEventListener('change', function(e){
    var cb = e.target;
    if (cb.matches && cb.matches('.toggles input')){
      gorunum[cb.getAttribute('data-g')] = cb.checked;
      Array.prototype.forEach.call(document.querySelectorAll('.toggles input[data-g="' + cb.getAttribute('data-g') + '"]'), function(x){ x.checked = cb.checked; });
      cizimleriYenile();
    }
  });

  function gecerliTarih(g, a, y){
    if (!(g >= 1 && a >= 1 && a <= 12 && y >= 1000 && y <= 2999)) return false;
    var d = new Date(Date.UTC(y, a - 1, g));
    return d.getUTCFullYear() === y && d.getUTCMonth() === a - 1 && d.getUTCDate() === g;
  }

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var isim = $('isim').value.trim();
    var g = parseInt($('gun').value, 10), a = parseInt($('ay').value, 10), y = parseInt($('yil').value, 10);
    if (!isim){ $('err').textContent = 'Lütfen isim soyisim girin.'; return; }
    if (!gecerliTarih(g, a, y)){ $('err').textContent = 'Lütfen geçerli bir doğum tarihi girin (gün, ay, dört haneli yıl).'; return; }
    var pg = parseInt($('pGun').value, 10), pa = parseInt($('pAy').value, 10), py = parseInt($('pYil').value, 10), partner = null;
    if ($('pGun').value || $('pAy').value || $('pYil').value){
      if (!gecerliTarih(pg, pa, py)){ $('err').textContent = 'Partnerin doğum tarihi geçerli değil (gün, ay, dört haneli yıl).'; return; }
      partner = {isim: $('pIsim').value.trim() || 'Partner', g:pg, a:pa, y:py};
    }
    $('err').textContent = '';
    durum = {isim:isim, g:g, a:a, y:y, partner:partner};
    goster();
    $('results').scrollIntoView({behavior:'smooth', block:'start'});
  });
})();
</script>
</body>
</html>
