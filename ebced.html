<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 EBCED HESABI - Numeroloji Uygulaması</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
            overflow-x: auto;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            min-width: 140px;
            white-space: nowrap;
        }

        .tab-button:hover {
            background: #f0f0f0;
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .content {
            padding: 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-section {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .input-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result-card {
            background: #f9f9f9;
            border-left: 5px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .result-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }

        .number-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-right: 10px;
            font-size: 1.1em;
        }

        .harmony-level {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 600;
        }

        .harmony-excellent {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .harmony-good {
            background: #dbeafe;
            color: #1e3a8a;
            border-left: 4px solid #3b82f6;
        }

        .harmony-moderate {
            background: #fef3c7;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }

        .harmony-bad {
            background: #fee2e2;
            color: #7f1d1d;
            border-left: 4px solid #ef4444;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .detail-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .detail-box:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .detail-box h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
        }

        .detail-box p {
            color: #666;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .traits-list {
            list-style: none;
            margin-top: 10px;
        }

        .traits-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
            color: #666;
        }

        .traits-list li:before {
            content: "✨";
            position: absolute;
            left: 0;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .person-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .person-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
        }

        .guidance-points {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #e0e0e0;
        }

        .guidance-points ul {
            list-style: none;
            padding-left: 0;
        }

        .guidance-points li {
            padding: 10px 0;
            padding-left: 30px;
            position: relative;
            color: #666;
            border-bottom: 1px solid #f0f0f0;
        }

        .guidance-points li:last-child {
            border-bottom: none;
        }

        .guidance-points li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: bold;
            font-size: 1.2em;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .char-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .char-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }

        .char-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }

        .char-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .char-info {
            font-size: 0.9em;
            color: #666;
            line-height: 1.5;
        }

        .energy-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }

        .compatibility-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .compatibility-table th,
        .compatibility-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .compatibility-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #667eea;
            font-family: 'Cinzel', serif;
        }

        .compatibility-table tr:hover {
            background: #f9f9f9;
        }

        @media (max-width: 768px) {
            .input-row {
                grid-template-columns: 1fr;
            }

            .comparison-grid {
                grid-template-columns: 1fr;
            }

            .char-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .tab-button {
                min-width: 100px;
                font-size: 0.85em;
                padding: 10px;
            }

            .content {
                padding: 20px;
            }
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .error-message {
            background: #fee2e2;
            color: #7f1d1d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ef4444;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #10b981;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }

        strong {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 EBCED HESABI</h1>
            <p>Numeroloji ile İlişkileri Keşfedin • Nomen Est Omen - İsim Kaderdir</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" data-tab="single">📊 Tek İsim</button>
            <button class="tab-button" data-tab="harmony">💑 İki Kişi</button>
            <button class="tab-button" data-tab="marriage">💍 Evlilik</button>
            <button class="tab-button" data-tab="business">🤝 İş Ortaklığı</button>
            <button class="tab-button" data-tab="baby">👶 Ad Verme</button>
            <button class="tab-button" data-tab="numbers">🔢 Rakamlar</button>
        </div>

        <div class="content">
            <!-- Tek İsim Analizi -->
            <div id="single" class="tab-content active">
                <div class="input-section">
                    <h2>📊 Tek İsim Analizi</h2>
                    <div class="input-group">
                        <label for="singleName">İsim giriniz:</label>
                        <input type="text" id="singleName" placeholder="Örn: Mehmet, Ayşe, Ali...">
                    </div>
                    <button onclick="analyzeSingle()">Analiz Yap</button>
                </div>
                <div id="singleResult"></div>
            </div>

            <!-- İki Kişi Uyumu -->
            <div id="harmony" class="tab-content">
                <div class="input-section">
                    <h2>💑 İki Kişi Uyumu</h2>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="name1">Birinci İsim:</label>
                            <input type="text" id="name1" placeholder="Örn: Mehmet">
                        </div>
                        <div class="input-group">
                            <label for="name2">İkinci İsim:</label>
                            <input type="text" id="name2" placeholder="Örn: Ayşe">
                        </div>
                    </div>
                    <button onclick="analyzeHarmony()">Uyumu Kontrol Et</button>
                </div>
                <div id="harmonyResult"></div>
            </div>

            <!-- Evlilik Danışmanı -->
            <div id="marriage" class="tab-content">
                <div class="input-section">
                    <h2>💍 Evlilik Danışmanı</h2>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="wifeName">Eş 1 İsmi:</label>
                            <input type="text" id="wifeName" placeholder="Eş 1">
                        </div>
                        <div class="input-group">
                            <label for="husbandName">Eş 2 İsmi:</label>
                            <input type="text" id="husbandName" placeholder="Eş 2">
                        </div>
                    </div>
                    <button onclick="analyzeMarriage()">Evlilik Uyumunu Analiz Et</button>
                </div>
                <div id="marriageResult"></div>
            </div>

            <!-- İş Ortaklığı -->
            <div id="business" class="tab-content">
                <div class="input-section">
                    <h2>🤝 İş Ortaklığı Analizi</h2>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="partner1Name">Ortak 1 İsmi:</label>
                            <input type="text" id="partner1Name" placeholder="İş Ortağı 1">
                        </div>
                        <div class="input-group">
                            <label for="partner2Name">Ortak 2 İsmi:</label>
                            <input type="text" id="partner2Name" placeholder="İş Ortağı 2">
                        </div>
                    </div>
                    <button onclick="analyzeBusinessPartnership()">Ortaklık Uyumunu Kontrol Et</button>
                </div>
                <div id="businessResult"></div>
            </div>

            <!-- Ad Verme Rehberi -->
            <div id="baby" class="tab-content">
                <div class="input-section">
                    <h2>👶 Ad Verme Rehberi</h2>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="babyName">Bebeğin Adayı:</label>
                            <input type="text" id="babyName" placeholder="Örn: Zeynep, Ahmet...">
                        </div>
                        <div class="input-group">
                            <label for="babyGender">Cinsiyet:</label>
                            <select id="babyGender">
                                <option value="">Seçiniz</option>
                                <option value="boy">Erkek</option>
                                <option value="girl">Kız</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="parentName">Anne/Baba İsmi (Uyum için):</label>
                        <input type="text" id="parentName" placeholder="Ebeveyn ismi (opsiyonel)">
                    </div>
                    <button onclick="analyzeNameForBaby()">Ad Rehberini Göster</button>
                </div>
                <div id="babyResult"></div>
            </div>

            <!-- Rakam Özellikleri -->
            <div id="numbers" class="tab-content">
                <div class="input-section">
                    <h2>🔢 Rakam Özellikleri (1-9)</h2>
                    <p style="color: #666; margin-top: 10px;">Tüm rakamların detaylı özelliklerini ve enerji bilgilerini keşfedin</p>
                </div>
                <div id="numbersResult"></div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="ebced-app.js"></script>
</body>
</html>
